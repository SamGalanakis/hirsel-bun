<!DOCTYPE html>
<html lang="en" style="background:#1a1a1a">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hirsel</title>
  <style>html,body{background:#1a1a1a!important}</style>
  <link rel="stylesheet" href="./styles/main.css">
  <script defer src="/basecoat.js"></script>
</head>
<body class="h-screen flex flex-col overflow-hidden" x-data="appState()" style="background:#1a1a1a">

<!--#include file="./templates/svg-definitions.html" -->


<!--#include file="./templates/title-bar.html" -->

  <!-- Main Content Area -->
  <main class="flex-1 flex overflow-hidden bg-pasture-900">

<!--#include file="./templates/project-nav.html" -->

    <!-- Main Content (changes based on nav selection) -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Breadcrumb Header -->
      <header
        x-show="selectedProjectId"
        x-cloak
        class="breadcrumb-header pl-3 pr-4 py-2 border-b border-pasture-600 bg-pasture-800/50"
      >
        <nav class="breadcrumb">
          <ol>
            <li>
              <button
                @click="deselectProject()"
                class="breadcrumb-link flex items-center gap-1.5 hover:text-wool-200"
              >
                <i data-lucide="folder" class="w-3.5 h-3.5"></i>
                Projects
              </button>
            </li>
            <li class="breadcrumb-separator" aria-hidden="true">
              <i data-lucide="chevron-right" class="w-3 h-3"></i>
            </li>
            <li>
              <button
                @click="selectedRun = null; activeProjectView = 'board'"
                class="breadcrumb-link flex items-center gap-1.5"
                :class="!selectedRun ? 'text-wool-100 font-medium' : 'hover:text-wool-200'"
                x-text="selectedProject?.name"
              ></button>
            </li>
            <template x-if="activeProjectView === 'runs' || selectedRun">
              <li class="breadcrumb-separator" aria-hidden="true">
                <i data-lucide="chevron-right" class="w-3 h-3"></i>
              </li>
            </template>
            <template x-if="activeProjectView === 'runs' && !selectedRun">
              <li>
                <span class="breadcrumb-page">Runs</span>
              </li>
            </template>
            <template x-if="selectedRun">
              <li>
                <button
                  @click="selectedRun = null"
                  class="breadcrumb-link hover:text-wool-200"
                >
                  Runs
                </button>
              </li>
            </template>
            <template x-if="selectedRun">
              <li class="breadcrumb-separator" aria-hidden="true">
                <i data-lucide="chevron-right" class="w-3 h-3"></i>
              </li>
            </template>
            <template x-if="selectedRun">
              <li>
                <span class="breadcrumb-page" x-text="selectedRun"></span>
              </li>
            </template>
          </ol>
        </nav>
      </header>

      <!-- Inner content container -->
      <div class="flex-1 flex overflow-hidden">

<!--#include file="./templates/run-list-panel.html" -->

<!--#include file="./templates/project-setup.html" -->

<!--#include file="./templates/project-settings.html" -->

<!--#include file="./templates/draft-editor.html" -->

<!--#include file="./templates/specflow-board.html" -->

<!--#include file="./templates/run-details.html" -->

      </div>
    </div>

    <!-- Right Panel: Gyp (slide-out drawer) -->
    <aside
      x-show="aiChatOpen"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="translate-x-full"
      x-transition:enter-end="translate-x-0"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="translate-x-0"
      x-transition:leave-end="translate-x-full"
      class="ai-chat-panel w-96 flex-shrink-0 border-l border-pasture-600 flex flex-col bg-pasture-800"
      x-data="directChat()"
      x-effect="if (aiChatOpen && !connected && !loading) connect()"
      @keydown.escape.window="if (aiChatOpen && !pendingPermission) aiChatOpen = false"
    >
      <!-- Header -->
      <div class="p-3 border-b border-pasture-600 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <img src="/gyp.svg" class="size-12 shrink-0 p-1" alt="Gyp" />
          <div class="flex flex-col">
            <div class="flex items-center gap-2">
              <h2 class="text-sm font-medium text-wool-300">Gyp</h2>
              <!-- Connection status -->
              <span
                x-show="connected"
                class="w-2 h-2 rounded-full bg-sage"
                data-tooltip="Connected"
                data-side="bottom"
              ></span>
              <span
                x-show="!connected && !loading"
                class="w-2 h-2 rounded-full bg-wool-600"
                data-tooltip="Disconnected"
                data-side="bottom"
              ></span>
              <span
                x-show="loading"
                class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"
                data-tooltip="Connecting..."
                data-side="bottom"
              ></span>
            </div>
            <!-- Context indicator with toggle (only show when run has workspace) -->
            <label
              x-show="canUseRunContext()"
              class="label flex items-center gap-2 mt-0.5 cursor-pointer"
              :data-tooltip="useRunContext ? 'Using run-specific chat' : 'Using general chat'"
              data-side="bottom"
            >
              <input
                type="checkbox"
                role="switch"
                class="input"
                x-model="useRunContext"
                @change="reloadChat()"
              />
              <span
                class="text-xs truncate max-w-28"
                :class="useRunContext ? 'text-wool-400' : 'text-wool-600'"
                x-text="useRunContext ? getSelectedRunName() : 'General'"
              ></span>
            </label>
          </div>
        </div>
        <div class="flex items-center gap-1">
          <span
            class="p-1.5 cursor-help"
            :data-tooltip="'Context: ' + (getUIContext().selectedRun || 'No run') + (getUIContext().selectedWorker ? ' / ' + getUIContext().selectedWorker : '')"
            data-side="bottom"
          >
            <i data-lucide="info" class="w-4 h-4 text-wool-500 hover:text-wool-300"></i>
          </span>
          <button
            @click="disconnect(); aiChatOpen = false"
            class="p-1.5 rounded hover:bg-pasture-700 text-wool-500 hover:text-wool-300"
            data-tooltip="Close"
            data-side="bottom"
          >
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Loading state -->
      <div x-show="loading" class="flex-1 flex flex-col items-center justify-center p-6">
        <div class="spinner w-8 h-8 mb-4"></div>
        <p class="text-sm text-wool-400">Connecting to AI...</p>
      </div>

      <!-- Messages area -->
      <div x-show="!loading" class="flex-1 flex flex-col overflow-hidden">
        <!-- Messages container -->
        <div class="messages-container flex-1 overflow-y-auto p-4 space-y-4">
          <!-- Empty state -->
          <div x-show="messages.length === 0 && connected" class="text-center text-wool-500 py-8">
            <p class="text-sm">Ready to help!</p>
            <p class="text-xs mt-1 text-wool-600">Ask about your runs, tasks, or anything else.</p>
          </div>

          <!-- Messages -->
          <template x-for="msg in messages" :key="msg.id">
            <div>
              <!-- System message (centered, no bubble) -->
              <div x-show="msg.role === 'system'" class="flex justify-center my-2">
                <span class="text-xs text-wool-500 italic" x-text="msg.chunks && msg.chunks[0] ? msg.chunks[0].content : ''"></span>
              </div>

              <!-- User/Assistant messages -->
              <div
                x-show="msg.role !== 'system'"
                class="ai-chat-message"
                :class="{
                  'flex justify-end': msg.role === 'user',
                  'flex justify-start': msg.role === 'assistant'
                }"
              >
                <div
                  class="max-w-[85%] px-4 py-2.5"
                  :class="{
                    'ai-chat-message-user': msg.role === 'user',
                    'ai-chat-message-assistant': msg.role === 'assistant'
                  }"
                >
                  <!-- Chunks rendered in order -->
                  <template x-for="chunk in (msg.chunks || [])" :key="chunk.id">
                    <div>
                      <!-- Thinking chunk -->
                      <div x-show="chunk.type === 'thinking' && showThinking" class="ai-chat-thinking text-xs px-3 py-2 mb-2 rounded">
                        <div class="flex items-center gap-1 mb-1 text-wool-400">
                          <i data-lucide="brain" class="w-3 h-3"></i>
                          <span class="uppercase text-[10px] tracking-wide">Thinking</span>
                        </div>
                        <span x-text="(chunk.content || '').substring(0, 200) + ((chunk.content || '').length > 200 ? '...' : '')"></span>
                      </div>

                      <!-- Text chunk -->
                      <p
                        x-show="chunk.type === 'text'"
                        class="text-sm text-wool-200 whitespace-pre-wrap"
                        :class="{ 'ai-chat-streaming': msg.streaming && msg.role === 'assistant' }"
                        x-text="chunk.content"
                      ></p>

                      <!-- Tool chunk -->
                      <div
                        x-show="chunk.type === 'tool' && chunk.tool"
                        class="ai-chat-tool-card rounded-md border text-xs my-2"
                        :class="{
                          'border-wool-700 bg-wool-800/30': chunk.tool?.status === 'pending',
                          'border-amber-500/40 bg-amber-900/10': chunk.tool?.status === 'in_progress',
                          'border-sage/30 bg-sage/5': chunk.tool?.status === 'completed',
                          'border-terra/40 bg-terra/10': chunk.tool?.status === 'failed'
                        }"
                      >
                        <!-- Tool header -->
                        <div
                          class="flex items-center gap-2 px-3 py-2"
                          :class="{'cursor-pointer hover:bg-white/5 rounded-t-md': hasExpandableContent(chunk.tool)}"
                          @click="hasExpandableContent(chunk.tool) && toggleToolExpanded(chunk.tool?.id)"
                        >
                          <span class="flex-shrink-0 text-wool-400" :class="{'animate-pulse': chunk.tool?.status === 'in_progress'}" x-html="getToolIcon(chunk.tool?.kind)"></span>
                          <span class="font-medium text-wool-300 truncate" x-text="chunk.tool?.title"></span>
                          <!-- Command preview (for terminal tools, hide when expanded) -->
                          <template x-if="getCommandPreview(chunk.tool) && !chunk.tool?.expanded">
                            <code class="flex-1 min-w-0 font-mono text-wool-500 truncate text-[11px]" x-text="getCommandPreview(chunk.tool)"></code>
                          </template>
                          <!-- Expand indicator for tools with expandable content -->
                          <template x-if="hasExpandableContent(chunk.tool)">
                            <span class="text-wool-500 flex-shrink-0" x-html="getExpandIcon(chunk.tool?.expanded)"></span>
                          </template>
                          <span
                            class="ml-auto flex-shrink-0 flex items-center gap-1"
                            :class="getToolStatusClass(chunk.tool?.status || '')"
                          >
                            <span x-html="getToolStatusIcon(chunk.tool?.status || '')"></span>
                          </span>
                        </div>
                        <!-- Expanded view (result/output) -->
                        <div
                          x-show="chunk.tool?.expanded && hasExpandableContent(chunk.tool)"
                          x-transition
                          class="px-3 pb-2 border-t border-wool-700/50"
                        >
                          <!-- Result/Output -->
                          <template x-if="hasToolOutput(chunk.tool)">
                            <div class="mt-2">
                              <div class="text-[10px] text-wool-500 mb-1">Result</div>
                              <pre class="font-mono text-[11px] text-wool-400 bg-pasture-900/50 rounded px-2 py-1.5 overflow-x-auto whitespace-pre-wrap break-all max-h-48 overflow-y-auto" x-text="getToolOutput(chunk.tool)"></pre>
                            </div>
                          </template>
                          <!-- Command (only if title doesn't already show it) -->
                          <template x-if="getCommandPreview(chunk.tool) && !hasToolOutput(chunk.tool)">
                            <div class="mt-2">
                              <div class="text-[10px] text-wool-500 mb-1">Command</div>
                              <pre class="font-mono text-[11px] text-wool-400 bg-pasture-900/50 rounded px-2 py-1.5 overflow-x-auto whitespace-pre-wrap break-all" x-text="getToolCommand(chunk.tool)"></pre>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>
                  </template>

                  <!-- Timestamp -->
                  <div class="mt-1.5 text-[10px] text-wool-600" x-text="formatTime(msg.timestamp)"></div>
                </div>
              </div>
            </div>
          </template>

          <!-- Error display -->
          <div x-show="error" class="text-center text-terra py-2">
            <p class="text-sm" x-text="error"></p>
            <button @click="error = null" class="text-xs underline mt-1">Dismiss</button>
          </div>
        </div>

        <!-- Input area -->
        <div class="p-3 border-t border-pasture-600 flex-shrink-0">
          <div class="flex gap-2">
            <input
              type="text"
              x-model="inputText"
              @keydown.enter="sendMessage()"
              :disabled="streaming || !connected"
              :placeholder="connected ? 'Ask anything...' : 'Connecting...'"
              class="ai-chat-input flex-1 px-4 py-2.5 text-sm bg-pasture-900 border border-pasture-600 rounded-lg focus:outline-none focus:border-amber-500 text-wool-200 placeholder-wool-600 disabled:opacity-50"
            >
            <button
              @click="sendMessage()"
              :disabled="streaming || !inputText.trim() || !connected"
              class="px-4 py-2.5 bg-amber-600 hover:bg-amber-500 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg text-sm font-medium transition-colors"
            >
              <i data-lucide="send" class="w-4 h-4" x-show="!streaming"></i>
              <i data-lucide="loader-2" class="w-4 h-4 animate-spin" x-show="streaming"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Permission request modal overlay -->
      <template x-if="pendingPermission">
        <div class="absolute inset-0 bg-pasture-900/80 flex items-center justify-center p-4 z-10">
          <div class="ai-chat-permission-modal bg-pasture-800 border border-pasture-600 rounded-lg p-4 max-w-sm w-full shadow-xl">
            <div class="flex items-center gap-2 mb-3">
              <i data-lucide="shield-alert" class="w-5 h-5 text-golden"></i>
              <h3 class="text-sm font-medium text-wool-200">Permission Required</h3>
            </div>
            <p class="text-sm text-wool-300 mb-4" x-text="pendingPermission.title"></p>
            <p x-show="pendingPermission.description" class="text-xs text-wool-500 mb-4" x-text="pendingPermission.description"></p>

            <div class="space-y-2">
              <template x-for="option in pendingPermission.options" :key="option.optionId">
                <button
                  @click="respondToPermission(option.optionId)"
                  class="w-full px-4 py-2.5 text-sm rounded border ai-chat-permission-option text-left"
                  :class="{
                    'ai-chat-permission-allow border-sage': option.kind.includes('Allow'),
                    'ai-chat-permission-deny border-terra': option.kind === 'Deny'
                  }"
                >
                  <span x-text="option.label"></span>
                </button>
              </template>
            </div>
          </div>
        </div>
      </template>
    </aside>
  </main>

  <!-- Status Bar -->
  <footer class="status-bar px-4 py-1.5 border-t border-pasture-600 flex items-center justify-between text-xs">
    <div class="flex items-center gap-3 text-wool-600">
      <!-- Remote indicator -->
      <span x-show="currentRunDetail?.remoteUrl" class="flex items-center gap-1.5 text-amber-400" :data-tooltip="currentRunDetail?.remoteUrl" data-side="top">
        <i data-lucide="cloud" class="w-3 h-3 flex-shrink-0"></i>
        <span class="truncate max-w-[200px]" x-text="currentRunDetail?.remoteUrl?.replace(/^https?:\/\//, '').replace(/\.git$/, '').split('/').slice(-2).join('/') || 'remote'"></span>
      </span>
      <!-- Project path (truncated) - only show for local repos -->
      <span x-show="currentRunDetail?.projectPath && !currentRunDetail?.remoteUrl" class="flex items-center gap-1.5 max-w-md truncate" :data-tooltip="currentRunDetail?.projectPath" data-side="top">
        <i data-lucide="folder" class="w-3 h-3 flex-shrink-0"></i>
        <span class="truncate" x-text="currentRunDetail?.projectPath?.split('/').slice(-2).join('/') || ''"></span>
      </span>
      <!-- Git branch hint -->
      <span x-show="currentRunDetail?.name" class="flex items-center gap-1.5">
        <i data-lucide="git-branch" class="w-3 h-3 flex-shrink-0"></i>
        <span x-text="'hirsel/' + (currentRunDetail?.name || '')"></span>
      </span>
    </div>
    <!-- Version info -->
    <div class="text-wool-600" x-show="versionInfo">
      <span x-text="'v' + (versionInfo?.version || '') + ' (' + (versionInfo?.gitSha || '') + ')'"></span>
    </div>
  </footer>

<!--#include file="./templates/worker-output-viewer.html" -->


<!--#include file="./templates/attach-picker.html" -->

<!--#include file="./templates/help-modal.html" -->

<!--#include file="./templates/settings-modal.html" -->

<!--#include file="./templates/sheep-clicker.html" -->


  <!-- Confirm Dialog -->
  <dialog id="confirm-dialog" class="dialog w-full max-w-md">
    <div>
      <header>
        <h2 data-confirm-title class="text-lg font-semibold tracking-tight text-wool-100">Confirm</h2>
        <p data-confirm-message class="text-sm text-wool-400">Are you sure?</p>
      </header>
      <footer>
        <button data-confirm-cancel class="btn btn-secondary">Cancel</button>
        <button data-confirm-ok class="btn btn-destructive">Confirm</button>
      </footer>
    </div>
  </dialog>

  <!-- Basecoat Toaster -->
  <div id="toaster" class="toaster"></div>

<!--#include file="./templates/debug-panel.html" -->


  <!-- Load Tauri APIs -->
  <script type="module" src="./main.ts"></script>


</body>
</html>
