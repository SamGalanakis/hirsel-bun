  <!-- Settings Modal -->
  <div
    x-cloak
    x-show="showSettings"
    x-data="settingsModal()"
    x-init="
      $watch('showSettings', (val) => {
        if (val) loadSettings();
        else stopHealthPolling();
      });
    "
    x-transition.opacity
    @click.self="showSettings = false"
    @keydown.escape.window="if (showSettings) showSettings = false"
    class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-6"
  >
    <div class="bg-pasture-800 rounded-lg shadow-xl flex flex-col overflow-hidden w-full h-full max-w-5xl max-h-[900px]" @click.stop>
      <!-- Header -->
      <div class="px-6 py-4 border-b border-pasture-600 flex items-center justify-between flex-shrink-0">
        <h2 class="text-lg font-semibold text-wool-100">Settings</h2>
        <button @click="showSettings = false" class="text-wool-500 hover:text-wool-300 transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Body: Sidebar + Content -->
      <div class="flex flex-1 overflow-hidden">

<!--#include file="./settings/sidebar.html" -->

        <!-- Content Area -->
        <div class="flex-1 overflow-hidden flex flex-col">
          <!-- Loading state -->
          <div x-show="loading" class="flex-1 flex items-center justify-center text-wool-500">
            Loading settings...
          </div>

<!--#include file="./settings/app-section.html" -->

<!--#include file="./settings/profile-section.html" -->

<!--#include file="./settings/dialogs.html" -->

        </div><!-- /flex-1 content -->

      </div><!-- /sidebar + content wrapper -->

      <!-- Footer -->
      <div class="px-6 py-4 border-t border-pasture-600 flex justify-end flex-shrink-0">
        <div class="flex gap-3">
          <button @click="showSettings = false" class="btn btn-ghost">Cancel</button>
          <button @click="saveSettings()" :disabled="saving" class="btn">
            <span x-show="!saving">Save</span>
            <span x-show="saving">Saving...</span>
          </button>
        </div>
      </div>

    </div>
  </div>
