  <!-- Sheep Clicker Mini-Game -->
  <div
    x-cloak
    x-data="sheepClickerGame()"
    x-show="isOpen"
    x-transition.opacity
    @click.self="close()"
    class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 sheep-clicker-overlay"
  >
    <div class="bg-pasture-800 rounded-xl shadow-2xl w-[700px] max-h-[85vh] overflow-hidden border border-pasture-600" @click.stop>
      <!-- Header -->
      <div class="p-4 border-b border-pasture-600 flex items-center justify-between bg-gradient-to-r from-pasture-700 to-pasture-800">
        <div class="flex items-center gap-3">
          <span class="text-3xl">🐑</span>
          <div>
            <h2 class="text-xl font-bold text-amber-500">Sheep Clicker</h2>
            <p class="text-xs text-wool-500">Pass time while your agents work</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button @click="reset()" class="text-xs px-2 py-1 rounded bg-terra/20 text-terra hover:bg-terra/30 transition-colors" data-tooltip="Reset game" data-side="bottom">
            Reset
          </button>
          <button @click="close()" class="text-wool-500 hover:text-wool-300 transition-colors">
            <i data-lucide="x" class="w-6 h-6"></i>
          </button>
        </div>
      </div>

      <div class="flex h-[500px]">
        <!-- Main Game Area -->
        <div class="flex-1 flex flex-col items-center justify-center p-6 relative overflow-hidden">
          <!-- Wool Counter -->
          <div class="text-center mb-6">
            <div class="text-5xl font-bold text-amber-500 sheep-clicker-wool-count" x-text="formatNumber(wool)"></div>
            <div class="text-wool-400 text-lg">wool</div>
            <div class="text-wool-600 text-sm mt-1">
              <span x-text="formatNumber(woolPerClick * clickMultiplier)"></span>/click
              <span class="mx-2">•</span>
              <span x-text="formatNumber(woolPerSecond)"></span>/sec
            </div>
          </div>

          <!-- Clickable Sheep -->
          <button
            @click="clickSheep($event)"
            class="sheep-clicker-sheep relative w-48 h-48 rounded-full bg-gradient-to-br from-wool-200 to-wool-400 shadow-lg hover:shadow-xl transition-all duration-100 flex items-center justify-center group"
            :class="{ 'sheep-bounce': sheepBounce }"
          >
            <!-- Sheep SVG -->
            <svg class="w-36 h-36 text-pasture-800 group-hover:scale-105 transition-transform" viewBox="0 0 64 64">
              <!-- Body (fluffy wool) -->
              <ellipse cx="32" cy="38" rx="20" ry="14" fill="currentColor" opacity="0.3"/>
              <ellipse cx="30" cy="36" rx="18" ry="12" fill="currentColor" opacity="0.5"/>
              <ellipse cx="32" cy="34" rx="16" ry="10" fill="currentColor" opacity="0.8"/>
              <!-- Head -->
              <ellipse cx="48" cy="28" rx="8" ry="6" fill="currentColor"/>
              <!-- Ear -->
              <ellipse cx="52" cy="22" rx="3" ry="4" fill="currentColor" opacity="0.8"/>
              <!-- Eye -->
              <circle cx="50" cy="27" r="2" fill="#fff"/>
              <circle cx="50.5" cy="26.5" r="1" fill="#1a1f1c"/>
              <!-- Legs -->
              <rect x="22" y="44" width="3" height="10" rx="1" fill="currentColor" opacity="0.7"/>
              <rect x="28" y="44" width="3" height="10" rx="1" fill="currentColor" opacity="0.7"/>
              <rect x="36" y="44" width="3" height="10" rx="1" fill="currentColor" opacity="0.7"/>
              <rect x="42" y="44" width="3" height="10" rx="1" fill="currentColor" opacity="0.7"/>
            </svg>

            <!-- Floating Numbers -->
            <template x-for="num in floatingNumbers" :key="num.id">
              <div
                class="sheep-clicker-floating absolute text-amber-400 font-bold text-xl pointer-events-none"
                :style="`left: ${num.x}px; top: ${num.y}px;`"
                x-text="'+' + num.value"
              ></div>
            </template>
          </button>

          <!-- Combo indicator -->
          <div x-show="comboCount > 1" x-transition class="mt-4 text-amber-400 font-bold">
            <span x-text="comboCount"></span>x Combo!
          </div>

          <!-- Achievement notification area -->
          <div class="absolute bottom-4 left-4 right-4 text-center">
            <template x-for="achievement in achievements.filter(a => a.unlocked).slice(-3)" :key="achievement.id">
              <div class="inline-block mx-1 px-2 py-1 bg-golden/20 text-golden rounded text-xs">
                <span x-text="achievement.icon"></span>
                <span x-text="achievement.name"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- Upgrades Panel -->
        <div class="w-64 border-l border-pasture-600 bg-pasture-900/50 flex flex-col">
          <div class="p-3 border-b border-pasture-600">
            <h3 class="font-semibold text-wool-200">Upgrades</h3>
          </div>
          <div class="flex-1 overflow-y-auto p-2 space-y-2">
            <template x-for="upgrade in upgrades" :key="upgrade.id">
              <button
                @click="buyUpgrade(upgrade.id)"
                :disabled="!canAfford(getUpgradeCost(upgrade))"
                class="w-full p-3 rounded-lg text-left transition-all duration-150"
                :class="canAfford(getUpgradeCost(upgrade))
                  ? 'bg-pasture-700 hover:bg-pasture-600 cursor-pointer'
                  : 'bg-pasture-800 opacity-50 cursor-not-allowed'"
              >
                <div class="flex items-center gap-2">
                  <span class="text-2xl" x-text="upgrade.icon"></span>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between">
                      <span class="font-medium text-wool-200 text-sm" x-text="upgrade.name"></span>
                      <span class="text-xs text-wool-500" x-text="'x' + upgrade.owned" x-show="upgrade.owned > 0"></span>
                    </div>
                    <div class="text-xs text-wool-500 truncate" x-text="upgrade.description"></div>
                    <div class="text-xs font-medium mt-1" :class="canAfford(getUpgradeCost(upgrade)) ? 'text-sage' : 'text-terra'">
                      <span x-text="formatNumber(getUpgradeCost(upgrade))"></span> wool
                    </div>
                  </div>
                </div>
              </button>
            </template>
          </div>

          <!-- Stats -->
          <div class="p-3 border-t border-pasture-600 text-xs text-wool-500 space-y-1">
            <div class="flex justify-between">
              <span>Total wool:</span>
              <span class="text-wool-300" x-text="formatNumber(totalWool)"></span>
            </div>
            <div class="flex justify-between">
              <span>Achievements:</span>
              <span class="text-wool-300" x-text="achievements.filter(a => a.unlocked).length + '/' + achievements.length"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
