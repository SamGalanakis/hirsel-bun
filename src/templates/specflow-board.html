    <!-- Center Panel: SpecFlow Board (shown when project is selected, board view active, no run) -->
    <section
      class="specflow-board flex-1 flex flex-col overflow-hidden bg-pasture-900 relative"
      x-data="specflowBoard()"
      x-show="selectedProjectId && activeProjectView === 'board' && !selectedRun && !showProjectSettings"
      x-cloak
      @keydown.window="handleKeydown($event)"
      @hide-board-menus.window="hideAllMenus()"
    >
      <!-- Canvas layer for grid and wires -->
      <canvas
        x-ref="canvas"
        class="absolute inset-0 w-full h-full pointer-events-none"
        style="z-index: 0"
      ></canvas>

      <!-- Viewport container for pan/zoom -->
      <div
        x-ref="viewport"
        class="absolute inset-0 overflow-hidden"
        style="z-index: 1"
        @contextmenu.prevent="showCanvasContextMenu($event)"
      >
        <!-- Transformed container for islands -->
        <div
          x-ref="container"
          class="absolute origin-top-left will-change-transform"
          :style="`transform: translate(${transform.x}px, ${transform.y}px) scale(${transform.k})`"
        >
          <!-- Islands -->
          <template x-for="island in islands" :key="island.id">
            <div
              class="island absolute bg-pasture-800 border border-pasture-600 rounded-lg shadow-lg select-none"
              :class="{
                'ring-2 ring-amber-500': selectedIslandId === island.id,
                'island-collapsed': island.collapsed
              }"
              :style="`left: ${island.x}px; top: ${island.y}px; width: ${island.width}px`"
              :data-island-id="island.id"
              @mousedown.stop="handleIslandMouseDown($event, island)"
            >
              <!-- Island Header -->
              <div
                class="island-header flex items-center justify-between px-3 py-2 border-b border-pasture-600 cursor-move"
                :class="getIslandStatusClass(island)"
              >
                <div class="flex items-center gap-2 min-w-0">
                  <button
                    @click.stop="toggleCollapse(island)"
                    class="p-0.5 hover:bg-pasture-600/50 rounded text-wool-500 hover:text-wool-300"
                  >
                    <i
                      :data-lucide="island.collapsed ? 'chevron-right' : 'chevron-down'"
                      class="w-4 h-4"
                    ></i>
                  </button>
                  <span
                    class="text-sm font-medium text-wool-200 truncate"
                    x-text="island.name"
                    @dblclick.stop="startEditingIslandName(island)"
                  ></span>
                </div>
                <div class="flex items-center gap-1">
                  <button
                    @click.stop="showIslandMenu(island, $event)"
                    class="p-1 hover:bg-pasture-600/50 rounded text-wool-500 hover:text-wool-300"
                  >
                    <i data-lucide="more-horizontal" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              <!-- Island Body (hidden when collapsed) -->
              <div x-show="!island.collapsed" class="island-body">
                <!-- LOAD: Far - just summary -->
                <template x-if="load === 'far'">
                  <div class="p-3 text-xs text-wool-500">
                    <span x-text="island.rows.length + ' rows'"></span>
                  </div>
                </template>

                <!-- LOAD: Mid/Near - full grid -->
                <template x-if="load !== 'far'">
                  <div>
                    <!-- Trifecta Header -->
                    <div class="trifecta-header grid grid-cols-[1fr_1fr_1fr_32px] gap-px text-[10px] font-medium uppercase tracking-wide border-b border-pasture-600">
                      <div class="px-2 py-1.5 bg-sky-900/20 text-sky-400 border-r border-pasture-700">Spec</div>
                      <div class="px-2 py-1.5 bg-amber-900/20 text-amber-400 border-r border-pasture-700">Task</div>
                      <div class="px-2 py-1.5 bg-sage/10 text-sage border-r border-pasture-700">Eval</div>
                      <div class="px-2 py-1.5 bg-pasture-800"></div>
                    </div>

                    <!-- Rows -->
                    <div class="trifecta-rows">
                      <template x-for="row in island.rows" :key="row.id">
                        <div
                          class="trifecta-row grid grid-cols-[1fr_1fr_1fr_32px] gap-px border-b border-pasture-700/50"
                          :class="{
                            'ring-1 ring-inset ring-amber-500/50': selectedRowsForDispatch.has(row.id),
                            'opacity-60': row.taskStatus === 'deleted'
                          }"
                          :data-row-id="row.id"
                        >
                          <!-- Spec Cell -->
                          <div
                            class="cell-spec px-2 py-2 bg-sky-900/5 border-r border-pasture-700/50 min-h-[48px] cursor-pointer hover:bg-sky-900/10"
                            :class="getSpecCellClass(row)"
                            @click="startEditingCell(island.id, row.id, 'spec')"
                          >
                            <template x-if="!isEditingCell(island.id, row.id, 'spec')">
                              <div class="text-xs text-wool-300 line-clamp-2" x-text="row.specContent || 'Click to add spec...'"></div>
                            </template>
                            <template x-if="isEditingCell(island.id, row.id, 'spec')">
                              <textarea
                                x-ref="specEditor"
                                class="w-full h-full bg-transparent text-xs text-wool-200 resize-none focus:outline-none"
                                :value="row.specContent || ''"
                                @blur="saveCell(island.id, row.id, 'spec', $event.target.value)"
                                @keydown.escape="cancelEditing()"
                                @keydown.meta.enter="saveCell(island.id, row.id, 'spec', $event.target.value)"
                                x-init="$nextTick(() => $el.focus())"
                              ></textarea>
                            </template>
                          </div>

                          <!-- Task Cell -->
                          <div
                            class="cell-task px-2 py-2 bg-amber-900/5 border-r border-pasture-700/50 min-h-[48px] cursor-pointer hover:bg-amber-900/10"
                            :class="getTaskCellClass(row)"
                            @click="startEditingCell(island.id, row.id, 'task')"
                          >
                            <template x-if="!isEditingCell(island.id, row.id, 'task')">
                              <div>
                                <div class="flex items-center gap-1 mb-0.5">
                                  <span
                                    class="w-2 h-2 rounded-full"
                                    :class="getTaskStatusDot(row.taskStatus)"
                                  ></span>
                                  <span class="text-xs text-wool-300 truncate" x-text="row.taskTitle || 'Add task...'"></span>
                                </div>
                                <div x-show="row.taskWorker" class="text-[10px] text-wool-500 truncate" x-text="row.taskWorker"></div>
                              </div>
                            </template>
                            <template x-if="isEditingCell(island.id, row.id, 'task')">
                              <textarea
                                x-ref="taskEditor"
                                class="w-full h-full bg-transparent text-xs text-wool-200 resize-none focus:outline-none"
                                :value="row.taskTitle || ''"
                                @blur="saveCell(island.id, row.id, 'task', $event.target.value)"
                                @keydown.escape="cancelEditing()"
                                @keydown.meta.enter="saveCell(island.id, row.id, 'task', $event.target.value)"
                                x-init="$nextTick(() => $el.focus())"
                              ></textarea>
                            </template>
                          </div>

                          <!-- Eval Cell -->
                          <div
                            class="cell-eval px-2 py-2 bg-sage/5 border-r border-pasture-700/50 min-h-[48px] cursor-pointer hover:bg-sage/10"
                            :class="getEvalCellClass(row)"
                            @click="startEditingCell(island.id, row.id, 'eval')"
                          >
                            <template x-if="!isEditingCell(island.id, row.id, 'eval')">
                              <div>
                                <div class="text-xs text-wool-300 line-clamp-2" x-text="row.evalCriterion || 'Add eval...'"></div>
                                <div x-show="row.evalStatus !== 'pending'" class="mt-0.5">
                                  <span
                                    class="text-[10px] px-1 py-0.5 rounded"
                                    :class="row.evalStatus === 'pass' ? 'bg-sage/20 text-sage' : 'bg-terra/20 text-terra'"
                                    x-text="row.evalStatus"
                                  ></span>
                                </div>
                              </div>
                            </template>
                            <template x-if="isEditingCell(island.id, row.id, 'eval')">
                              <textarea
                                x-ref="evalEditor"
                                class="w-full h-full bg-transparent text-xs text-wool-200 resize-none focus:outline-none"
                                :value="row.evalCriterion || ''"
                                @blur="saveCell(island.id, row.id, 'eval', $event.target.value)"
                                @keydown.escape="cancelEditing()"
                                @keydown.meta.enter="saveCell(island.id, row.id, 'eval', $event.target.value)"
                                x-init="$nextTick(() => $el.focus())"
                              ></textarea>
                            </template>
                          </div>

                          <!-- Row Actions -->
                          <div class="cell-actions px-1 py-2 bg-pasture-800 flex flex-col items-center justify-center gap-1">
                            <template x-if="runMode === 'dispatch'">
                              <input
                                type="checkbox"
                                class="w-3 h-3 rounded border-wool-600"
                                :checked="selectedRowsForDispatch.has(row.id)"
                                @change="toggleRowSelection(row)"
                                @click.stop
                              />
                            </template>
                            <template x-if="runMode !== 'dispatch'">
                              <button
                                @click.stop="showRowMenu(island, row, $event)"
                                class="p-0.5 hover:bg-pasture-600/50 rounded text-wool-500 hover:text-wool-300"
                              >
                                <i data-lucide="more-vertical" class="w-3 h-3"></i>
                              </button>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>

                    <!-- Add Row Button -->
                    <button
                      @click="addRow(island)"
                      class="w-full px-2 py-1.5 text-xs text-wool-500 hover:text-wool-300 hover:bg-pasture-700/50 transition-colors flex items-center justify-center gap-1"
                    >
                      <i data-lucide="plus" class="w-3 h-3"></i>
                      Add row
                    </button>
                  </div>
                </template>
              </div>

              <!-- Island resize handle -->
              <div
                class="absolute right-0 top-0 bottom-0 w-2 cursor-ew-resize hover:bg-amber-500/20"
                @mousedown.stop="startResizing(island, $event)"
              ></div>
            </div>
          </template>
        </div>
      </div>

      <!-- HUD Toolbar -->
      <div class="hud-toolbar absolute top-4 left-4 right-4 flex items-center justify-between pointer-events-none" style="z-index: 10">
        <!-- Left: Mode indicator -->
        <div class="flex items-center gap-3 pointer-events-auto">
          <span
            class="text-xs px-2 py-0.5 rounded"
            :class="runMode === 'dispatch' ? 'bg-amber-500/20 text-amber-400' : 'bg-pasture-700 text-wool-400'"
            x-text="runMode === 'edit' ? 'Edit Mode' : 'Dispatch Mode'"
          ></span>
        </div>

        <!-- Right: Actions -->
        <div class="flex items-center gap-2 pointer-events-auto">
          <!-- Search / Command palette trigger -->
          <button
            @click="showCommandPalette = true"
            class="btn btn-sm btn-ghost"
            data-tooltip="Search (Cmd+K)"
            data-side="bottom"
          >
            <i data-lucide="search" class="w-4 h-4"></i>
          </button>

          <!-- Zoom controls -->
          <div class="flex items-center gap-1 bg-pasture-800 rounded-lg border border-pasture-600 px-2 py-1">
            <button @click="zoomOut()" class="p-1 hover:bg-pasture-700 rounded text-wool-400 hover:text-wool-200">
              <i data-lucide="minus" class="w-3 h-3"></i>
            </button>
            <span class="text-xs text-wool-400 w-10 text-center" x-text="Math.round(transform.k * 100) + '%'"></span>
            <button @click="zoomIn()" class="p-1 hover:bg-pasture-700 rounded text-wool-400 hover:text-wool-200">
              <i data-lucide="plus" class="w-3 h-3"></i>
            </button>
            <button @click="fitAll()" class="p-1 hover:bg-pasture-700 rounded text-wool-400 hover:text-wool-200 ml-1" data-tooltip="Fit all" data-side="bottom">
              <i data-lucide="maximize-2" class="w-3 h-3"></i>
            </button>
          </div>

          <!-- Mode toggles -->
          <div class="flex items-center bg-pasture-800 rounded-lg border border-pasture-600">
            <button
              @click="setRunMode('edit')"
              class="px-3 py-1.5 text-xs font-medium rounded-l-lg transition-colors"
              :class="runMode === 'edit' ? 'bg-pasture-600 text-wool-200' : 'text-wool-500 hover:text-wool-300'"
            >
              Edit
            </button>
            <button
              @click="setRunMode('dispatch')"
              class="px-3 py-1.5 text-xs font-medium rounded-r-lg transition-colors"
              :class="runMode === 'dispatch' ? 'bg-amber-500/20 text-amber-400' : 'text-wool-500 hover:text-wool-300'"
            >
              Dispatch
            </button>
          </div>

          <!-- Add island button -->
          <button
            @click="createIslandAtCenter()"
            class="btn btn-sm"
          >
            <i data-lucide="plus" class="w-4 h-4 mr-1"></i>
            Island
          </button>
        </div>
      </div>

      <!-- Dispatch toolbar (shown in dispatch mode with selection) -->
      <div
        x-show="runMode === 'dispatch' && selectedRowsForDispatch.size > 0"
        x-transition
        class="dispatch-toolbar absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-3 bg-pasture-800 border border-pasture-600 rounded-lg px-4 py-2 shadow-lg"
        style="z-index: 10"
      >
        <span class="text-sm text-wool-300">
          <span class="font-medium text-wool-100" x-text="selectedRowsForDispatch.size"></span> rows selected
        </span>
        <div class="w-px h-4 bg-pasture-600"></div>
        <button @click="clearDispatchSelection()" class="btn btn-sm btn-ghost">
          Clear
        </button>
        <button @click="selectBlockedByRows()" class="btn btn-sm btn-ghost" data-tooltip="Include blocked-by dependencies" data-side="top">
          + Dependencies
        </button>
        <button @click="dispatchSelectedRows()" class="btn btn-sm">
          <i data-lucide="rocket" class="w-4 h-4 mr-1"></i>
          Dispatch
        </button>
      </div>

      <!-- Command Palette -->
      <div
        x-show="showCommandPalette"
        x-transition
        @click.self="showCommandPalette = false"
        @keydown.escape.window="showCommandPalette = false"
        class="fixed inset-0 bg-black/50 flex items-start justify-center pt-[15vh]"
        style="z-index: 50"
      >
        <div class="bg-pasture-800 border border-pasture-600 rounded-lg shadow-2xl w-full max-w-md overflow-hidden">
          <div class="flex items-center gap-2 px-4 py-3 border-b border-pasture-600">
            <i data-lucide="search" class="w-4 h-4 text-wool-500"></i>
            <input
              type="text"
              x-model="commandQuery"
              @input="filterCommands()"
              x-ref="commandInput"
              x-init="$watch('showCommandPalette', (v) => v && $nextTick(() => $el.focus()))"
              placeholder="Search islands, bookmarks, or commands..."
              class="flex-1 bg-transparent text-sm text-wool-200 placeholder-wool-600 focus:outline-none"
            />
          </div>
          <div class="max-h-64 overflow-y-auto">
            <!-- Islands -->
            <div x-show="filteredIslands.length > 0" class="py-1">
              <div class="px-3 py-1.5 text-[10px] font-medium text-wool-500 uppercase tracking-wide">Islands</div>
              <template x-for="island in filteredIslands" :key="island.id">
                <button
                  @click="jumpToIsland(island); showCommandPalette = false"
                  class="w-full px-3 py-2 text-left text-sm text-wool-300 hover:bg-pasture-700 flex items-center gap-2"
                >
                  <i data-lucide="box" class="w-4 h-4 text-wool-500"></i>
                  <span x-text="island.name"></span>
                  <span class="text-xs text-wool-600" x-text="island.rows.length + ' rows'"></span>
                </button>
              </template>
            </div>
            <!-- Bookmarks -->
            <div x-show="filteredBookmarks.length > 0" class="py-1 border-t border-pasture-700">
              <div class="px-3 py-1.5 text-[10px] font-medium text-wool-500 uppercase tracking-wide">Bookmarks</div>
              <template x-for="bm in filteredBookmarks" :key="bm.id">
                <button
                  @click="jumpToBookmark(bm); showCommandPalette = false"
                  class="w-full px-3 py-2 text-left text-sm text-wool-300 hover:bg-pasture-700 flex items-center gap-2"
                >
                  <i data-lucide="bookmark" class="w-4 h-4 text-wool-500"></i>
                  <span x-text="bm.name"></span>
                </button>
              </template>
            </div>
            <!-- Commands -->
            <div x-show="filteredCommands.length > 0" class="py-1 border-t border-pasture-700">
              <div class="px-3 py-1.5 text-[10px] font-medium text-wool-500 uppercase tracking-wide">Commands</div>
              <template x-for="cmd in filteredCommands" :key="cmd.id">
                <button
                  @click="executeCommand(cmd); showCommandPalette = false"
                  class="w-full px-3 py-2 text-left text-sm text-wool-300 hover:bg-pasture-700 flex items-center gap-2"
                >
                  <span x-html="cmd.icon" class="text-wool-500"></span>
                  <span x-text="cmd.label"></span>
                  <span x-show="cmd.shortcut" class="ml-auto text-[10px] text-wool-600" x-text="cmd.shortcut"></span>
                </button>
              </template>
            </div>
            <!-- Empty state -->
            <div x-show="commandQuery && filteredIslands.length === 0 && filteredBookmarks.length === 0 && filteredCommands.length === 0" class="py-8 text-center text-wool-500 text-sm">
              No results found
            </div>
          </div>
        </div>
      </div>

      <!-- Dispatch Warning Modal -->
      <div
        x-show="dispatchWarning"
        x-transition
        @click.self="dispatchWarning = null"
        class="fixed inset-0 bg-black/50 flex items-center justify-center"
        style="z-index: 50"
      >
        <div class="bg-pasture-800 border border-pasture-600 rounded-lg shadow-2xl w-full max-w-md p-6">
          <div class="flex items-center gap-3 mb-4">
            <div class="p-2 bg-golden/10 rounded-full">
              <i data-lucide="alert-triangle" class="w-5 h-5 text-golden"></i>
            </div>
            <h3 class="text-lg font-medium text-wool-100">Warning</h3>
          </div>
          <p class="text-sm text-wool-400 mb-4" x-text="dispatchWarning?.message"></p>
          <div x-show="dispatchWarning?.rowIds?.length" class="mb-4 max-h-32 overflow-y-auto">
            <div class="text-xs text-wool-500 mb-2">Affected rows:</div>
            <div class="space-y-1">
              <template x-for="rowId in dispatchWarning?.rowIds" :key="rowId">
                <div class="text-xs text-wool-400 bg-pasture-700 px-2 py-1 rounded" x-text="getRowPreview(rowId)"></div>
              </template>
            </div>
          </div>
          <div class="flex justify-end gap-2">
            <button @click="dispatchWarning = null" class="btn btn-ghost">
              Cancel
            </button>
            <button @click="confirmDispatch()" class="btn">
              Dispatch Anyway
            </button>
          </div>
        </div>
      </div>

      <!-- Canvas Context Menu (right-click on empty space) -->
      <div
        x-show="canvasMenuVisible"
        x-transition
        @click.away="hideAllMenus()"
        @keydown.escape.window="hideAllMenus()"
        :style="`left: ${menuX}px; top: ${menuY}px`"
        class="fixed z-50 bg-pasture-700 border border-pasture-600 rounded shadow-lg py-1 min-w-[160px]"
      >
        <button
          @click.stop="createIslandAtPosition(); hideAllMenus()"
          class="w-full px-3 py-1.5 text-left text-sm text-wool-200 hover:bg-pasture-600 flex items-center gap-2"
        >
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Island
        </button>
        <button
          @click.stop="fitAll(); hideAllMenus()"
          class="w-full px-3 py-1.5 text-left text-sm text-wool-200 hover:bg-pasture-600 flex items-center gap-2"
        >
          <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i> Fit All
        </button>
      </div>

      <!-- Island Context Menu (x-if removes from DOM when hidden) -->
      <template x-if="islandMenuVisible && menuIsland">
        <div
          x-transition
          @click.away="hideAllMenus()"
          @keydown.escape.window="hideAllMenus()"
          :style="`left: ${menuX}px; top: ${menuY}px`"
          class="fixed z-50 bg-pasture-700 border border-pasture-600 rounded shadow-lg py-1 min-w-[140px]"
        >
          <button
            @click.stop="saveAsBookmark(menuIsland); hideAllMenus()"
            class="w-full px-3 py-1.5 text-left text-sm text-wool-200 hover:bg-pasture-600 flex items-center gap-2"
          >
            <i data-lucide="bookmark" class="w-3.5 h-3.5"></i> Bookmark
          </button>
          <div class="border-t border-pasture-600 my-1"></div>
          <button
            @click.stop="deleteIsland(menuIsland); hideAllMenus()"
            class="w-full px-3 py-1.5 text-left text-sm text-terra hover:bg-pasture-600 flex items-center gap-2"
          >
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Delete
          </button>
        </div>
      </template>

      <!-- Row Context Menu (x-if removes from DOM when hidden) -->
      <template x-if="rowMenuVisible && menuRow">
        <div
          x-transition
          @click.away="hideAllMenus()"
          @keydown.escape.window="hideAllMenus()"
          :style="`left: ${menuX}px; top: ${menuY}px`"
          class="fixed z-50 bg-pasture-700 border border-pasture-600 rounded shadow-lg py-1 min-w-[160px]"
        >
          <button
            @click.stop="setTaskStatus(menuRow, 'doing'); hideAllMenus()"
            x-show="menuRow?.taskStatus !== 'doing'"
            class="w-full px-3 py-1.5 text-left text-sm text-wool-200 hover:bg-pasture-600 flex items-center gap-2"
          >
            <span class="w-2 h-2 rounded-full bg-amber-500"></span> Mark Doing
          </button>
          <button
            @click.stop="setTaskStatus(menuRow, 'done'); hideAllMenus()"
            x-show="menuRow?.taskStatus !== 'done'"
            class="w-full px-3 py-1.5 text-left text-sm text-wool-200 hover:bg-pasture-600 flex items-center gap-2"
          >
            <span class="w-2 h-2 rounded-full bg-sage"></span> Mark Done
          </button>
          <button
            @click.stop="setTaskStatus(menuRow, 'blocked'); hideAllMenus()"
            x-show="menuRow?.taskStatus !== 'blocked'"
            class="w-full px-3 py-1.5 text-left text-sm text-wool-200 hover:bg-pasture-600 flex items-center gap-2"
          >
            <span class="w-2 h-2 rounded-full bg-terra"></span> Mark Blocked
          </button>
          <div class="border-t border-pasture-600 my-1"></div>
          <button
            @click.stop="deleteRow(menuIsland, menuRow); hideAllMenus()"
            class="w-full px-3 py-1.5 text-left text-sm text-terra hover:bg-pasture-600 flex items-center gap-2"
          >
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Delete
          </button>
        </div>
      </template>

      <!-- AI Prompt Bubble -->
      <div
        x-show="showAiPrompt"
        x-transition
        @click.away="cancelAiPrompt()"
        @keydown.escape.window="cancelAiPrompt()"
        :style="`left: ${aiPromptX}px; top: ${aiPromptY}px`"
        class="fixed z-50 w-80"
      >
        <div class="bg-pasture-800 border border-amber-500/50 rounded-lg shadow-2xl overflow-hidden">
          <div class="px-3 py-2 bg-amber-500/10 border-b border-amber-500/30 flex items-center gap-2">
            <i data-lucide="sparkles" class="w-4 h-4 text-amber-400"></i>
            <span class="text-xs font-medium text-amber-300">Describe your feature</span>
          </div>
          <div class="p-3">
            <textarea
              x-model="aiPromptText"
              x-ref="aiPromptInput"
              x-init="$watch('showAiPrompt', (v) => v && $nextTick(() => $el.focus()))"
              @keydown.meta.enter="submitAiPrompt()"
              @keydown.ctrl.enter="submitAiPrompt()"
              placeholder="e.g., Add user authentication with OAuth..."
              class="w-full h-20 bg-pasture-900 border border-pasture-600 rounded text-sm text-wool-200 placeholder-wool-600 resize-none focus:outline-none focus:border-amber-500/50 p-2"
            ></textarea>
            <div class="flex items-center justify-between mt-2">
              <span class="text-[10px] text-wool-600">Cmd+Enter to create</span>
              <div class="flex gap-2">
                <button @click="cancelAiPrompt()" class="btn btn-sm btn-ghost">Cancel</button>
                <button @click="submitAiPrompt()" class="btn btn-sm" :disabled="!aiPromptText.trim()">
                  <i data-lucide="plus" class="w-3 h-3 mr-1"></i>
                  Create
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Loading overlay -->
      <div
        x-show="loading"
        class="absolute inset-0 bg-pasture-900/80 flex items-center justify-center"
        style="z-index: 100"
      >
        <div class="text-center">
          <div class="spinner w-8 h-8 mb-3 mx-auto"></div>
          <p class="text-sm text-wool-400">Loading board...</p>
        </div>
      </div>
    </section>
