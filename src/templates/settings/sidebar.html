        <!-- Sidebar Navigation - Profile Centric -->
        <nav class="w-52 border-r border-pasture-600 flex flex-col shrink-0 bg-pasture-800/50">
          <!-- APP Section -->
          <div class="p-3 flex flex-col gap-1">
            <div class="text-xs font-semibold text-wool-500 uppercase tracking-wider px-3 py-1.5">App</div>
            <button
              @click="navigateToApp('theme')"
              :class="activeSection === 'app' && appSection === 'theme' ? 'bg-pasture-700 text-wool-100 font-medium' : 'text-wool-400 hover:text-wool-200 hover:bg-pasture-700/50'"
              class="flex items-center gap-2.5 px-3 py-2 rounded-md text-sm text-left w-full transition-colors"
            >
              <i data-lucide="palette" class="w-4 h-4"></i>
              Theme
            </button>
            <button
              @click="navigateToApp('controls')"
              :class="activeSection === 'app' && appSection === 'controls' ? 'bg-pasture-700 text-wool-100 font-medium' : 'text-wool-400 hover:text-wool-200 hover:bg-pasture-700/50'"
              class="flex items-center gap-2.5 px-3 py-2 rounded-md text-sm text-left w-full transition-colors"
            >
              <i data-lucide="keyboard" class="w-4 h-4"></i>
              Controls
            </button>
          </div>

          <!-- Divider -->
          <div class="border-t border-pasture-600 mx-3"></div>

          <!-- PROFILES Section -->
          <div class="p-3 flex flex-col gap-1 flex-1 overflow-y-auto">
            <div class="text-xs font-semibold text-wool-500 uppercase tracking-wider px-3 py-1.5">Profiles</div>

            <!-- Local Profile (always shown) -->
            <button
              @click="navigateToProfile('local')"
              :class="activeSection === 'profile' && selectedProfile === 'local' ? 'bg-pasture-700 text-wool-100 font-medium' : 'text-wool-400 hover:text-wool-200 hover:bg-pasture-700/50'"
              class="flex items-center gap-2 px-3 py-2 rounded-md text-sm text-left w-full transition-colors group"
            >
              <i data-lucide="laptop" class="w-4 h-4 text-sage"></i>
              <span class="flex-1">local</span>
              <span x-show="settings.defaultProfile === 'local'" class="text-amber-400 text-xs">●</span>
            </button>

            <!-- Remote Profiles -->
            <template x-for="name in remoteProfileNames" :key="name">
              <button
                @click="navigateToProfile(name)"
                :class="activeSection === 'profile' && selectedProfile === name ? 'bg-pasture-700 text-wool-100 font-medium' : 'text-wool-400 hover:text-wool-200 hover:bg-pasture-700/50'"
                class="flex items-center gap-2 px-3 py-2 rounded-md text-sm text-left w-full transition-colors group"
              >
                <i data-lucide="server" class="w-4 h-4 text-sage"></i>
                <span class="flex-1 truncate" x-text="name"></span>
                <!-- Default indicator -->
                <span x-show="settings.defaultProfile === name" class="text-amber-400 text-xs">●</span>
                <!-- Health status dot -->
                <span x-show="profileHealth[name]"
                  class="w-2 h-2 rounded-full shrink-0"
                  :class="{
                    'bg-wool-500 animate-pulse': profileHealth[name]?.status === 'checking',
                    'bg-green-400': profileHealth[name]?.status === 'online' && !profileHealth[name]?.error,
                    'bg-amber-400': profileHealth[name]?.status === 'online' && profileHealth[name]?.error,
                    'bg-terra': profileHealth[name]?.status === 'offline'
                  }"
                  :data-tooltip="getHealthTooltip(name)">
                </span>
              </button>
            </template>

            <!-- Add Profile Button -->
            <button
              @click="startAddProfile()"
              class="flex items-center gap-2 px-3 py-2 rounded-md text-sm text-left w-full transition-colors text-wool-500 hover:text-wool-300 hover:bg-pasture-700/50"
            >
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>Add Profile</span>
            </button>
          </div>
        </nav>
