          <!-- ==================== APP SECTION ==================== -->
          <div x-show="!loading && activeSection === 'app'" class="flex-1 overflow-y-auto p-8">
            <div class="max-w-2xl mx-auto">

              <!-- THEME SECTION -->
              <div x-show="appSection === 'theme'" class="grid gap-6">
                <div>
                  <h3 class="text-lg font-medium text-wool-100 mb-1">Theme</h3>
                  <p class="text-muted-foreground text-sm">Customize the appearance of the application.</p>
                </div>

                <div class="grid gap-2">
                  <label for="settings-theme">Color Theme</label>
                  <div class="select" x-data="{ open: false }" data-select-initialized="true">
                    <button type="button" class="btn-outline w-full" @click="open = !open" @click.away="open = false"
                      aria-haspopup="listbox" :aria-expanded="open">
                      <span class="truncate flex items-center gap-2 flex-1">
                        <span x-text="themes.find(t => t.id === selectedTheme)?.name"></span>
                      </span>
                      <div class="flex items-center gap-1 mr-2">
                        <template x-for="color in (themes.find(t => t.id === selectedTheme)?.swatches || [])" :key="color">
                          <span class="w-3 h-3 rounded-full border border-white/20" :style="`background-color: ${color}`"></span>
                        </template>
                      </div>
                      <i data-lucide="chevrons-up-down" class="w-4 h-4 opacity-50 shrink-0"></i>
                    </button>
                    <div data-popover :aria-hidden="!open" x-show="open" x-transition>
                      <div role="listbox" aria-orientation="vertical">
                        <template x-for="theme in themes" :key="theme.id">
                          <div role="option" :data-value="theme.id" :aria-selected="selectedTheme === theme.id"
                            @click="applyTheme(theme.id); open = false" class="flex items-center justify-between gap-2">
                            <span class="flex-1" x-text="theme.name"></span>
                            <div class="flex items-center gap-1">
                              <template x-for="color in theme.swatches" :key="color">
                                <span class="w-3 h-3 rounded-full border border-white/20" :style="`background-color: ${color}`"></span>
                              </template>
                            </div>
                          </div>
                        </template>
                      </div>
                    </div>
                  </div>
                  <p class="text-muted-foreground text-sm" x-text="themes.find(t => t.id === selectedTheme)?.description"></p>
                </div>
              </div>

              <!-- CONTROLS SECTION -->
              <div x-show="appSection === 'controls'" class="grid gap-6">
                <div class="flex items-center justify-between">
                  <div>
                    <h3 class="text-lg font-medium text-wool-100 mb-1">Keyboard Shortcuts</h3>
                    <p class="text-muted-foreground text-sm">Click any shortcut to rebind. Press Escape to cancel.</p>
                  </div>
                  <button @click="resetAllShortcuts()" class="btn btn-ghost btn-sm">
                    <i data-lucide="rotate-ccw" class="w-4 h-4 mr-1"></i>
                    Reset to Defaults
                  </button>
                </div>

                <!-- Conflict warning -->
                <div x-show="shortcutConflict" x-cloak class="bg-amber-500/10 border border-amber-500/30 rounded-lg p-3 text-sm text-amber-400 flex items-center gap-2">
                  <i data-lucide="alert-triangle" class="w-4 h-4 shrink-0"></i>
                  <span x-text="shortcutConflict"></span>
                </div>

                <!-- Navigation -->
                <div class="grid gap-2">
                  <h4 class="text-sm font-medium text-wool-200">Navigation</h4>
                  <div class="grid gap-1.5 text-sm">
                    <template x-for="shortcut in getShortcutsByCategory('navigation')" :key="shortcut.action">
                      <div class="flex justify-between items-center py-1.5 border-b border-pasture-700">
                        <span class="text-wool-300" x-text="shortcut.label"></span>
                        <button @click="startRebind(shortcut.action)"
                          :class="rebindingAction === shortcut.action ? 'ring-2 ring-amber-500 ring-offset-1 ring-offset-pasture-800' : 'hover:bg-pasture-600'"
                          class="cursor-pointer transition-all rounded px-1">
                          <kbd x-show="rebindingAction !== shortcut.action" class="kbd text-wool-500" x-text="formatBinding(shortcut.binding)"></kbd>
                          <span x-show="rebindingAction === shortcut.action" class="kbd text-amber-400 animate-pulse">Press key...</span>
                        </button>
                      </div>
                    </template>
                  </div>
                </div>

                <!-- Run Controls -->
                <div class="grid gap-2">
                  <h4 class="text-sm font-medium text-wool-200">Run Controls</h4>
                  <div class="grid gap-1.5 text-sm">
                    <template x-for="shortcut in getShortcutsByCategory('run-controls')" :key="shortcut.action">
                      <div class="flex justify-between items-center py-1.5 border-b border-pasture-700">
                        <span class="text-wool-300" x-text="shortcut.label"></span>
                        <button @click="startRebind(shortcut.action)"
                          :class="rebindingAction === shortcut.action ? 'ring-2 ring-amber-500 ring-offset-1 ring-offset-pasture-800' : 'hover:bg-pasture-600'"
                          class="cursor-pointer transition-all rounded px-1">
                          <kbd x-show="rebindingAction !== shortcut.action" class="kbd text-wool-500" x-text="formatBinding(shortcut.binding)"></kbd>
                          <span x-show="rebindingAction === shortcut.action" class="kbd text-amber-400 animate-pulse">Press key...</span>
                        </button>
                      </div>
                    </template>
                  </div>
                </div>

                <!-- Communication -->
                <div class="grid gap-2">
                  <h4 class="text-sm font-medium text-wool-200">Communication</h4>
                  <div class="grid gap-1.5 text-sm">
                    <template x-for="shortcut in getShortcutsByCategory('communication')" :key="shortcut.action">
                      <div class="flex justify-between items-center py-1.5 border-b border-pasture-700">
                        <span class="text-wool-300" x-text="shortcut.label"></span>
                        <button @click="startRebind(shortcut.action)"
                          :class="rebindingAction === shortcut.action ? 'ring-2 ring-amber-500 ring-offset-1 ring-offset-pasture-800' : 'hover:bg-pasture-600'"
                          class="cursor-pointer transition-all rounded px-1">
                          <kbd x-show="rebindingAction !== shortcut.action" class="kbd text-wool-500" x-text="formatBinding(shortcut.binding)"></kbd>
                          <span x-show="rebindingAction === shortcut.action" class="kbd text-amber-400 animate-pulse">Press key...</span>
                        </button>
                      </div>
                    </template>
                  </div>
                </div>

                <!-- Other -->
                <div class="grid gap-2">
                  <h4 class="text-sm font-medium text-wool-200">Other</h4>
                  <div class="grid gap-1.5 text-sm">
                    <template x-for="shortcut in getShortcutsByCategory('other')" :key="shortcut.action">
                      <div class="flex justify-between items-center py-1.5 border-b border-pasture-700 last:border-b-0">
                        <span class="text-wool-300" x-text="shortcut.label"></span>
                        <button @click="startRebind(shortcut.action)"
                          :class="rebindingAction === shortcut.action ? 'ring-2 ring-amber-500 ring-offset-1 ring-offset-pasture-800' : 'hover:bg-pasture-600'"
                          class="cursor-pointer transition-all rounded px-1">
                          <kbd x-show="rebindingAction !== shortcut.action" class="kbd text-wool-500" x-text="formatBinding(shortcut.binding)"></kbd>
                          <span x-show="rebindingAction === shortcut.action" class="kbd text-amber-400 animate-pulse">Press key...</span>
                        </button>
                      </div>
                    </template>
                  </div>
                </div>
              </div>

            </div><!-- /max-w-2xl -->
          </div><!-- /app section -->
