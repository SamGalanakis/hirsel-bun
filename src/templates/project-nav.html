    <!-- Navigation Rail (far left sidebar) -->
    <aside
      class="nav-rail w-14 flex-shrink-0 border-r border-pasture-600 flex flex-col bg-pasture-800"
    >
      <!-- Navigation Items (only when project selected) -->
      <nav x-show="selectedProjectId" class="flex-1 p-2 flex flex-col gap-1">
        <!-- Project Info -->
        <button
          @click="showProjectSettings = true; $dispatch('hide-board-menus')"
          class="w-10 h-10 rounded-lg flex items-center justify-center transition-colors"
          :class="showProjectSettings ? 'bg-amber-500/20 text-amber-500' : 'hover:bg-pasture-700 text-wool-400 hover:text-wool-200'"
          data-tooltip="Project info"
          data-side="right"
        >
          <i data-lucide="info" class="w-5 h-5"></i>
        </button>

        <!-- Board -->
        <button
          @click="activeProjectView = 'board'; selectedRun = null"
          class="w-10 h-10 rounded-lg flex items-center justify-center transition-colors"
          :class="activeProjectView === 'board' && !selectedRun ? 'bg-amber-500/20 text-amber-500' : 'hover:bg-pasture-700 text-wool-400 hover:text-wool-200'"
          data-tooltip="Board"
          data-side="right"
        >
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        </button>

        <!-- Runs -->
        <button
          @click="activeProjectView = 'runs'"
          class="w-10 h-10 rounded-lg flex items-center justify-center transition-colors"
          :class="activeProjectView === 'runs' || selectedRun ? 'bg-amber-500/20 text-amber-500' : 'hover:bg-pasture-700 text-wool-400 hover:text-wool-200'"
          data-tooltip="Runs"
          data-side="right"
        >
          <i data-lucide="play-circle" class="w-5 h-5"></i>
        </button>
      </nav>
    </aside>
