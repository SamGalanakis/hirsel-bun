    <!-- Center Panel: Project Setup (shown when creating new project) -->
    <section
      class="project-setup flex-1 flex flex-col overflow-hidden bg-pasture-900"
      x-data="projectSetup()"
      x-show="showProjectSetup"
      x-cloak
    >
      <!-- Header -->
      <div class="px-6 py-4 border-b border-pasture-600 bg-pasture-800/30">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <h2 class="text-xl font-semibold text-wool-100">New Project</h2>
          </div>
          <button
            @click="cancelSetup()"
            class="btn btn-ghost"
          >
            Cancel
          </button>
        </div>
      </div>

      <!-- Setup Form -->
      <div class="flex-1 flex flex-col items-center justify-center p-8 overflow-y-auto">
        <div class="w-full max-w-lg">
          <!-- Project Name -->
          <div class="mb-6">
            <label class="block text-sm font-medium text-wool-300 mb-2">Project Name</label>
            <input
              type="text"
              x-model="name"
              placeholder="my-project"
              class="w-full bg-pasture-800 border-pasture-500"
              @keydown.enter="name && startingPointValid && createProject()"
            />
            <p class="text-xs text-wool-600 mt-1">A unique name for your project</p>
          </div>

          <!-- Starting Point Selection -->
          <div class="mb-6">
            <label class="block text-sm font-medium text-wool-300 mb-2">Starting Point</label>
            <p class="text-xs text-wool-600 mb-4">Select where runs in this project will work from</p>

            <div class="grid gap-3">
              <!-- Greenfield -->
              <button
                type="button"
                @click="startingPointType = 'greenfield'"
                class="w-full p-4 rounded-lg border-2 transition-all text-left"
                :class="startingPointType === 'greenfield'
                  ? 'bg-pasture-700 border-amber-500 text-wool-100'
                  : 'bg-pasture-800/50 border-pasture-600 text-wool-300 hover:border-pasture-500'"
              >
                <div class="flex items-center gap-3">
                  <span :class="startingPointType === 'greenfield' ? 'text-amber-500' : 'text-wool-500'">
                    <i data-lucide="file-plus" class="w-5 h-5"></i>
                  </span>
                  <div>
                    <div class="font-medium">Greenfield</div>
                    <div class="text-xs text-wool-500">Empty git-initialized workspace for new projects</div>
                  </div>
                </div>
              </button>

              <!-- Local Folder -->
              <div
                class="w-full rounded-lg border-2 transition-all text-left"
                :class="startingPointType === 'local'
                  ? 'bg-pasture-700 border-amber-500 text-wool-100'
                  : 'bg-pasture-800/50 border-pasture-600 text-wool-300 hover:border-pasture-500'"
              >
                <button
                  type="button"
                  @click="startingPointType = 'local'"
                  class="w-full p-4 text-left"
                >
                  <div class="flex items-center gap-3">
                    <i data-lucide="folder" class="w-5 h-5" :class="startingPointType === 'local' ? 'text-amber-500' : 'text-wool-500'"></i>
                    <div>
                      <div class="font-medium">Local Folder</div>
                      <div x-show="startingPointType !== 'local'" class="text-xs text-wool-500">Copy files from a local directory</div>
                    </div>
                  </div>
                </button>
                <div x-show="startingPointType === 'local'" class="px-4 pb-4">
                  <div class="relative">
                    <div class="flex gap-2">
                      <input
                        type="text"
                        x-model="localPath"
                        @click.stop
                        @input="debouncedFetchPathSuggestions()"
                        @keydown="handlePathKeydown($event)"
                        @focus="debouncedFetchPathSuggestions()"
                        @blur="hidePathSuggestions()"
                        placeholder="/path/to/folder or ~/projects"
                        class="flex-1 font-mono text-sm bg-pasture-800 border-pasture-500"
                      />
                      <button type="button" @click.stop="browseLocalFolder()" class="btn-outline shrink-0">
                        <i data-lucide="folder-open" class="w-4 h-4"></i>
                      </button>
                    </div>
                    <!-- Path suggestions dropdown -->
                    <div
                      x-show="showPathSuggestions && pathSuggestions.length > 0"
                      x-cloak
                      @click.stop
                      class="absolute z-50 w-full mt-1 bg-pasture-800 border border-pasture-500 rounded-lg shadow-lg overflow-hidden"
                    >
                      <template x-for="(suggestion, index) in pathSuggestions" :key="suggestion">
                        <button
                          type="button"
                          @mousedown.prevent="selectPathSuggestion(suggestion)"
                          class="w-full px-3 py-2 text-left text-sm font-mono truncate transition-colors"
                          :class="index === selectedSuggestionIndex ? 'bg-amber-500/20 text-amber-300' : 'text-wool-300 hover:bg-pasture-700'"
                          x-text="suggestion"
                        ></button>
                      </template>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Git Repository -->
              <div
                class="w-full rounded-lg border-2 transition-all text-left"
                :class="startingPointType === 'git'
                  ? 'bg-pasture-700 border-amber-500 text-wool-100'
                  : 'bg-pasture-800/50 border-pasture-600 text-wool-300 hover:border-pasture-500'"
              >
                <button
                  type="button"
                  @click="startingPointType = 'git'"
                  class="w-full p-4 text-left"
                >
                  <div class="flex items-center gap-3">
                    <i data-lucide="git-branch" class="w-5 h-5" :class="startingPointType === 'git' ? 'text-amber-500' : 'text-wool-500'"></i>
                    <div>
                      <div class="font-medium">Git Repository</div>
                      <div x-show="startingPointType !== 'git'" class="text-xs text-wool-500">Clone from a remote git repository</div>
                    </div>
                  </div>
                </button>
                <div x-show="startingPointType === 'git'" class="px-4 pb-4 grid gap-3">
                  <div>
                    <input
                      type="text"
                      x-model="gitUrl"
                      @click.stop
                      @input="debouncedValidateGitUrl()"
                      placeholder="https://github.com/owner/repo"
                      class="w-full font-mono text-sm bg-pasture-800 border-pasture-500"
                    />
                    <div x-show="gitValidating" class="flex items-center gap-2 text-xs text-wool-500 mt-2">
                      <div class="spinner w-3 h-3"></div>
                      Validating...
                    </div>
                    <div x-show="gitError" class="text-xs text-terra mt-2" x-text="gitError"></div>
                  </div>
                  <div x-show="availableBranches.length > 0">
                    <div class="dropdown min-w-32 max-w-48" x-data="{ open: false }">
                      <button type="button" class="btn-outline w-full font-mono text-sm" @click.stop="open = !open" @click.away="open = false"
                        aria-haspopup="listbox" :aria-expanded="open">
                        <span class="truncate flex-1 text-left" x-text="gitBranch || 'Select a branch...'"></span>
                        <i data-lucide="chevrons-up-down" class="w-4 h-4 opacity-50 shrink-0"></i>
                      </button>
                      <div data-popover :aria-hidden="!open" x-show="open" x-transition @click.stop>
                        <div role="listbox" aria-orientation="vertical">
                          <template x-for="branch in availableBranches" :key="branch">
                            <div role="option" :data-value="branch" :aria-selected="gitBranch === branch"
                              @click="gitBranch = branch; open = false"
                              x-text="branch" class="font-mono text-sm"></div>
                          </template>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Create button -->
          <button
            type="button"
            @click="createProject()"
            :disabled="!canCreate() || creating"
            class="btn w-full"
          >
            <template x-if="creating">
              <div class="spinner w-4 h-4 border-pasture-900 mr-2"></div>
            </template>
            <span x-text="creating ? 'Creating...' : 'Create Project'"></span>
          </button>
        </div>
      </div>
    </section>
