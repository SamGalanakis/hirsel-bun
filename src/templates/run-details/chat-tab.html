      <!-- MESSAGES TAB -->
      <!-- Note: x-show must be on outer wrapper, x-data on inner element to access parent scope -->
      <div x-show="runName && activeTab === 'chat'" class="flex-1 flex overflow-hidden">
      <div x-data="chatPanel()" class="flex-1 flex overflow-hidden">
        <!-- Thread sidebar -->
        <div class="w-48 border-r border-pasture-600 flex flex-col bg-pasture-800/50">
          <div class="flex-1 overflow-y-auto">
            <!-- Group Chats Section -->
            <div class="p-2 border-b border-pasture-700">
              <h4 class="text-[10px] font-semibold text-wool-500 uppercase tracking-wider px-1">Group Chats</h4>
            </div>
            <div class="py-1">
              <template x-for="gc in groupChats" :key="gc.name">
                <button
                  @click="selectThread(gc.name)"
                  class="w-full px-3 py-1.5 text-left text-sm hover:bg-pasture-700 transition-colors flex items-center justify-between"
                  :class="{ 'bg-pasture-700 border-l-2 border-amber-500': selectedThread === gc.name }"
                >
                  <span class="flex items-center gap-2">
                    <span class="w-3 h-3 text-wool-500" x-html="getGroupChatIcon(gc.name)"></span>
                    <span class="truncate" x-text="gc.name"></span>
                  </span>
                  <span x-show="gc.thread?.unreadCount > 0" class="ml-2 min-w-[18px] h-[18px] bg-terra rounded-full text-[10px] text-white font-bold flex items-center justify-center px-1" x-text="gc.thread?.unreadCount"></span>
                </button>
              </template>
            </div>

            <!-- DMs Section -->
            <div class="p-2 border-b border-t border-pasture-700">
              <h4 class="text-[10px] font-semibold text-wool-500 uppercase tracking-wider px-1">Direct Messages</h4>
            </div>
            <div class="py-1">
              <template x-for="dm in dmThreads" :key="dm.name">
                <button
                  @click="selectThread(dm.name)"
                  class="w-full px-3 py-1.5 text-left text-sm hover:bg-pasture-700 transition-colors flex items-center justify-between"
                  :class="{ 'bg-pasture-700 border-l-2 border-amber-500': selectedThread === dm.name }"
                >
                  <span class="flex items-center gap-2">
                    <span class="w-4 h-4 flex-shrink-0" x-html="getWorkerAvatar(dm.name)"></span>
                    <span class="truncate" x-text="dm.name"></span>
                  </span>
                  <span x-show="dm.thread?.unreadCount > 0" class="ml-2 min-w-[18px] h-[18px] bg-terra rounded-full text-[10px] text-white font-bold flex items-center justify-center px-1" x-text="dm.thread?.unreadCount"></span>
                </button>
              </template>
              <div x-show="dmThreads.length === 0" class="px-3 py-2 text-xs text-wool-600 italic">
                No workers in this run
              </div>
            </div>
          </div>
        </div>

        <!-- Messages area -->
        <div class="flex-1 flex flex-col">
          <!-- Messages header -->
          <div class="p-3 border-b border-pasture-700 flex items-center justify-between">
            <h3 class="text-sm font-medium text-wool-300">
              <span x-show="selectedThread" x-text="selectedThread"></span>
              <span x-show="!selectedThread" class="text-wool-500">Select a thread</span>
            </h3>
          </div>

          <!-- Messages list -->
          <div class="messages-container flex-1 overflow-y-auto p-4 space-y-4">
            <div x-show="loading" class="text-center text-wool-500 py-8">
              <span class="animate-pulse">Loading messages...</span>
            </div>
            <div x-show="error && !loading" class="text-center text-terra py-8">
              <p x-text="error"></p>
              <button @click="selectThread(selectedThread)" class="mt-2 text-xs text-amber-500 hover:underline">Retry</button>
            </div>
            <div x-show="!loading && !error && !selectedThread" class="text-center text-wool-500 py-8">
              <i data-lucide="message-circle" class="w-12 h-12 mx-auto mb-3 text-wool-600"></i>
              <p class="text-sm">Select a thread to view messages</p>
            </div>
            <div x-show="!loading && !error && selectedThread && messages.length === 0" class="text-center text-wool-500 py-8">
              <i data-lucide="message-square-plus" class="w-10 h-10 mx-auto mb-3 text-wool-600"></i>
              <p class="text-sm">No messages yet</p>
              <p class="text-xs mt-1 text-wool-600">Send a message to start the conversation</p>
            </div>
            <template x-for="msg in messages" :key="msg.id">
              <div class="message">
                <div class="flex items-baseline gap-2 mb-1">
                  <span class="text-sm font-medium" :class="getSenderColor(msg.sender)" x-text="msg.sender"></span>
                  <span class="text-xs text-wool-500" x-text="formatTime(msg.timestamp)"></span>
                  <span x-show="msg.waiting" class="text-xs text-golden">[waiting]</span>
                </div>
                <p class="text-sm text-wool-300 whitespace-pre-wrap" x-text="msg.content"></p>
              </div>
            </template>
          </div>

          <!-- Message input -->
          <div class="p-3 border-t border-pasture-700 flex-shrink-0">
            <div class="flex gap-2">
              <input
                type="text"
                x-model="newMessage"
                @keydown.enter="sendMessage()"
                :disabled="!selectedThread"
                placeholder="Type a message..."
                class="inline-chat-input flex-1 px-3 py-2 text-sm bg-pasture-900 border border-pasture-600 rounded focus:outline-none focus:border-amber-500 disabled:opacity-50"
                data-test="chat-input"
              >
              <button
                @click="sendMessage()"
                :disabled="!selectedThread"
                class="px-4 py-2 bg-amber-600 hover:bg-amber-500 disabled:opacity-50 disabled:hover:bg-amber-600 rounded text-sm font-medium transition-colors"
                data-test="chat-send-btn"
              >
                Send
              </button>
            </div>
          </div>
        </div>
      </div>
      </div>
      <!-- END MESSAGES TAB -->
