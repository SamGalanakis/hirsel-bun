      <!-- Deliver Modal -->
      <div
        x-show="deliverModalOpen"
        x-transition:enter="transition ease-out duration-150"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-100"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 z-50 flex items-center justify-center bg-black/60"
        @click.self="closeDeliverModal()"
        @keydown.escape.window="closeDeliverModal()"
      >
        <div
          class="modal-content bg-pasture-800 border border-pasture-600 rounded-lg shadow-xl w-full max-w-md mx-4"
          @click.stop
        >
          <div class="p-4 border-b border-pasture-600">
            <h3 class="text-lg font-semibold text-wool-200">Deliver Run</h3>
            <p class="text-sm text-wool-500 mt-1">Push changes to a branch on the remote repository.</p>
          </div>
          <div class="p-4">
            <label class="block text-sm font-medium text-wool-300 mb-2">
              Branch Name
            </label>
            <input
              type="text"
              x-model="deliverBranch"
              @keydown.enter="confirmDeliver()"
              class="w-full px-3 py-2 bg-pasture-700 border border-pasture-600 rounded text-wool-200 placeholder-wool-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500"
              placeholder="hirsel/my-feature"
            />
            <p class="text-xs text-wool-500 mt-2">
              This branch will be created or updated on the remote.
            </p>
          </div>
          <div class="p-4 border-t border-pasture-600 flex justify-end gap-3">
            <button
              @click="closeDeliverModal()"
              class="btn btn-ghost"
              :disabled="deliverLoading"
            >
              Cancel
            </button>
            <button
              @click="confirmDeliver()"
              :disabled="!deliverBranch.trim() || deliverLoading"
              class="btn btn-success flex items-center gap-2"
            >
              <span x-show="deliverLoading" class="animate-spin">
                <i data-lucide="loader-2" class="w-4 h-4"></i>
              </span>
              <span x-text="deliverLoading ? 'Delivering...' : 'Deliver'"></span>
            </button>
          </div>
        </div>
      </div>
