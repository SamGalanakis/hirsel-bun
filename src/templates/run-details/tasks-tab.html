      <!-- TASKS TAB: Full task list with details -->
      <!-- Note: x-show must be on outer wrapper, x-data on inner element to access parent scope -->
      <div x-show="runName && activeTab === 'tasks'" class="flex-1 flex flex-col overflow-hidden">
      <div x-data="tasksTab()" class="flex-1 flex flex-col overflow-hidden">
        <!-- Header with stats -->
        <div class="p-4 border-b border-pasture-600">
          <!-- Title row -->
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-3">
              <h3 class="text-lg font-semibold text-wool-200">Tasks</h3>
              <span class="text-sm text-wool-500">
                <span class="text-wool-300 font-medium" x-text="stats.done"></span>/<span x-text="stats.total"></span> complete
              </span>
            </div>
            <div class="flex items-center gap-2">
              <!-- Search -->
              <div class="relative">
                <i data-lucide="search" class="w-4 h-4 absolute left-2.5 top-1/2 -translate-y-1/2 text-wool-500 pointer-events-none"></i>
                <input
                  type="text"
                  x-model="searchQuery"
                  placeholder="Search tasks..."
                  class="input w-48 pl-8 text-sm py-1.5"
                />
              </div>
              <!-- Filter -->
              <select x-model="filter" class="select text-sm">
                <option value="all">All</option>
                <option value="todo">To Do</option>
                <option value="doing">In Progress</option>
                <option value="done">Done</option>
                <option value="blocked">Blocked</option>
              </select>
            </div>
          </div>
          <!-- Progress bar -->
          <div class="h-2 bg-pasture-700 rounded-full overflow-hidden">
            <div class="h-full bg-sage transition-all duration-500" :style="'width: ' + stats.percentDone + '%'"></div>
          </div>
          <!-- Stats pills -->
          <div class="flex items-center gap-3 mt-3 text-xs">
            <span class="flex items-center gap-1.5 px-2 py-1 rounded-full bg-pasture-700">
              <span class="w-2 h-2 rounded-full bg-wool-600"></span>
              <span class="text-wool-400"><span class="text-wool-200 font-medium" x-text="stats.todo"></span> to do</span>
            </span>
            <span class="flex items-center gap-1.5 px-2 py-1 rounded-full bg-pasture-700">
              <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
              <span class="text-wool-400"><span class="text-wool-200 font-medium" x-text="stats.inProgress"></span> in progress</span>
            </span>
            <span class="flex items-center gap-1.5 px-2 py-1 rounded-full bg-pasture-700">
              <span class="w-2 h-2 rounded-full bg-sage"></span>
              <span class="text-wool-400"><span class="text-wool-200 font-medium" x-text="stats.done"></span> done</span>
            </span>
            <span x-show="stats.blocked > 0" class="flex items-center gap-1.5 px-2 py-1 rounded-full bg-terra/20">
              <i data-lucide="lock" class="w-3 h-3 text-terra"></i>
              <span class="text-terra"><span class="font-medium" x-text="stats.blocked"></span> blocked</span>
            </span>
          </div>
        </div>

        <!-- Task list -->
        <div class="flex-1 overflow-y-auto p-4">
          <div class="space-y-1.5">
            <template x-for="task in filteredTasks" :key="task.id">
              <div
                :data-task-id="task.id"
                class="task-row group transition-all cursor-pointer inline-flex w-auto min-w-[600px] max-w-full"
                :style="'margin-left: ' + (task.depth * 16) + 'px'"
                @click="selectTask(task, $event)"
              >
                <!-- Card with left accent border and status-based colors -->
                <div
                  class="relative rounded-md transition-all flex-1"
                  :class="{
                    'bg-wool-800/30 border border-wool-700/30 hover:bg-wool-700/30': task.status === 'todo' && !task.isBlocked && selectedTaskId !== task.id,
                    'bg-amber-500/10 border border-amber-500/30 hover:bg-amber-500/15': task.status === 'doing' && selectedTaskId !== task.id,
                    'bg-sage/10 border border-sage/20 hover:bg-sage/15': task.status === 'done' && selectedTaskId !== task.id,
                    'bg-terra/10 border border-terra/30 hover:bg-terra/15': task.isBlocked && task.status !== 'done' && selectedTaskId !== task.id,
                    'ring-1 ring-wool-400/50 bg-wool-700/40': selectedTaskId === task.id
                  }"
                >
                  <!-- Left accent stripe -->
                  <div
                    class="absolute left-0 top-0 bottom-0 w-1 rounded-l-md"
                    :class="{
                      'bg-wool-500': task.status === 'todo' && !task.isBlocked,
                      'bg-terra': task.isBlocked && task.status !== 'done',
                      'bg-amber-500': task.status === 'doing',
                      'bg-sage': task.status === 'done'
                    }"
                  ></div>

                  <div class="flex items-center gap-2 py-2 px-3 pl-4">
                    <!-- Collapse toggle for tasks with children -->
                    <button
                      x-show="hasChildren(task)"
                      @click.stop="toggleCollapse(task.id)"
                      class="flex-shrink-0 w-4 h-4 flex items-center justify-center text-wool-500 hover:text-wool-300 transition-colors"
                    >
                      <span x-show="!isCollapsed(task.id)"><i data-lucide="chevron-down" class="w-3.5 h-3.5"></i></span>
                      <span x-show="isCollapsed(task.id)"><i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></span>
                    </button>
                    <span x-show="!hasChildren(task)" class="flex-shrink-0 w-4"></span>

                    <!-- Task description - color indicates status -->
                    <span
                      class="text-sm truncate max-w-[280px]"
                      :class="{
                        'text-amber-200 font-medium': task.status === 'doing',
                        'text-wool-300': task.status === 'todo' && !task.isBlocked,
                        'text-sage/80': task.status === 'done',
                        'text-terra/80': task.isBlocked && task.status !== 'done'
                      }"
                      x-text="task.description"
                      :title="task.description"
                    ></span>

                    <!-- Right side: worker + times + status badge -->
                    <div class="flex items-center gap-3 text-xs ml-auto">
                      <!-- Worker assignment -->
                      <span x-show="task.claimedBy" class="flex items-center gap-1.5 w-24">
                        <template x-if="getWorkerAvatar(task.claimedBy)">
                          <span x-html="getWorkerAvatar(task.claimedBy, 16)" class="flex-shrink-0"></span>
                        </template>
                        <span x-text="task.claimedBy" class="truncate text-wool-400"></span>
                      </span>

                      <!-- Duration -->
                      <span
                        x-show="task.claimedAt && (task.status === 'doing' || task.status === 'done')"
                        class="flex items-center gap-1 text-wool-500 tabular-nums"
                      >
                        <i data-lucide="timer" class="w-3 h-3"></i>
                        <span x-text="formatDuration(task.claimedAt, task.completedAt)"></span>
                      </span>

                      <!-- Status badge (active/blocked only) -->
                      <span
                        x-show="task.status === 'doing'"
                        class="px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide rounded bg-amber-500/30 text-amber-300"
                      >Active</span>
                      <span
                        x-show="task.isBlocked && task.status !== 'done'"
                        class="px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide rounded bg-terra/30 text-terra"
                      >Blocked</span>

                      <!-- Quick actions (visible on hover) -->
                      <div class="flex items-center opacity-0 group-hover:opacity-100 transition-opacity">
                        <button
                          x-show="task.status !== 'done'"
                          @click.stop="markTaskDone(task)"
                          class="p-1 rounded hover:bg-sage/20 text-wool-500 hover:text-sage transition-colors"
                          data-tooltip="Mark as done"
                          data-side="top"
                        >
                          <i data-lucide="check" class="w-3.5 h-3.5"></i>
                        </button>
                        <button
                          x-show="task.status === 'done'"
                          @click.stop="reopenTask(task)"
                          class="p-1.5 rounded-full hover:bg-amber-500/20 text-wool-500 hover:text-amber-400 transition-colors"
                          data-tooltip="Reopen task"
                          data-side="top"
                        >
                          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- Empty state -->
          <div x-show="filteredTasks.length === 0 && tasks.length > 0" class="text-center text-wool-500 py-12">
            <i data-lucide="filter-x" class="w-8 h-8 mx-auto mb-3 text-wool-600"></i>
            <p class="text-sm">No tasks match the current filter</p>
            <button @click="filter = 'all'; searchQuery = ''" class="mt-2 text-xs text-amber-500 hover:underline">Clear filters</button>
          </div>

          <div x-show="tasks.length === 0" class="text-center text-wool-500 py-12">
            <svg class="w-12 h-12 mx-auto mb-3 text-wool-600">
              <use href="#sheep-sleeping"/>
            </svg>
            <p class="text-sm">No tasks yet</p>
            <p class="text-xs mt-1 text-wool-600">Tasks will appear as workers create them</p>
          </div>
        </div>

        <!-- Task Detail Modal -->
        <div
          x-cloak
          x-show="showTaskModal && selectedTask"
          class="fixed inset-0 z-50 flex items-center justify-center p-4"
          @keydown.escape.window="closeTaskModal()"
        >
          <!-- Backdrop -->
          <div
            x-show="showTaskModal"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            class="absolute inset-0 bg-black/60"
            @click="closeTaskModal()"
          ></div>

          <!-- Modal -->
          <div
            x-show="showTaskModal"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 scale-95 translate-y-4"
            x-transition:enter-end="opacity-100 scale-100 translate-y-0"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100 scale-100 translate-y-0"
            x-transition:leave-end="opacity-0 scale-95 translate-y-4"
            class="relative w-full max-w-lg bg-pasture-800 border border-pasture-600 rounded-xl shadow-2xl overflow-hidden"
            @click.stop
          >
            <!-- Modal header -->
            <div class="p-4 border-b border-pasture-700 flex items-start justify-between gap-3">
              <div class="flex items-center gap-3">
                <span :class="{
                  'text-wool-500': selectedTask?.status === 'todo' && !selectedTask?.isBlocked,
                  'text-terra': selectedTask?.isBlocked && selectedTask?.status !== 'done',
                  'text-amber-500': selectedTask?.status === 'doing',
                  'text-sage': selectedTask?.status === 'done'
                }">
                  <i x-show="selectedTask?.status === 'todo' && !selectedTask?.isBlocked" data-lucide="circle" class="w-6 h-6"></i>
                  <i x-show="selectedTask?.isBlocked && selectedTask?.status !== 'done'" data-lucide="lock" class="w-6 h-6"></i>
                  <i x-show="selectedTask?.status === 'doing'" data-lucide="loader" class="w-6 h-6 animate-spin"></i>
                  <i x-show="selectedTask?.status === 'done'" data-lucide="check-circle-2" class="w-6 h-6"></i>
                </span>
                <span
                  class="text-sm px-3 py-1 rounded-full font-medium"
                  :class="{
                    'bg-wool-600/20 text-wool-400': selectedTask?.status === 'todo' && !selectedTask?.isBlocked,
                    'bg-terra/20 text-terra': selectedTask?.isBlocked && selectedTask?.status !== 'done',
                    'bg-amber-500/20 text-amber-400': selectedTask?.status === 'doing',
                    'bg-sage/20 text-sage': selectedTask?.status === 'done'
                  }"
                  x-text="selectedTask?.isBlocked && selectedTask?.status !== 'done' ? 'Blocked' : getStatusLabel(selectedTask?.status)"
                ></span>
              </div>
              <button
                @click="closeTaskModal()"
                class="p-1.5 rounded-lg hover:bg-pasture-700 text-wool-500 hover:text-wool-300 transition-colors"
              >
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>

            <!-- Modal content -->
            <div class="p-5 overflow-y-auto max-h-[60vh]">
              <!-- Description -->
              <p class="text-base text-wool-100 leading-relaxed" x-text="selectedTask?.description"></p>

              <!-- Metadata -->
              <div class="mt-5 space-y-4">
                <!-- Assigned worker with sheep avatar -->
                <div x-show="selectedTask?.claimedBy" class="flex items-center gap-3 p-3 bg-pasture-700/50 rounded-lg">
                  <div class="w-10 h-10 flex items-center justify-center flex-shrink-0">
                    <template x-if="getWorkerAvatar(selectedTask?.claimedBy)">
                      <div x-html="getWorkerAvatar(selectedTask?.claimedBy, 40)"></div>
                    </template>
                    <template x-if="!getWorkerAvatar(selectedTask?.claimedBy)">
                      <div class="w-10 h-10 rounded-full bg-amber-500/20 flex items-center justify-center">
                        <i data-lucide="user" class="w-5 h-5 text-amber-400"></i>
                      </div>
                    </template>
                  </div>
                  <div>
                    <p class="text-xs text-wool-500">Assigned to</p>
                    <p class="text-sm text-wool-100 font-medium" x-text="selectedTask?.claimedBy"></p>
                  </div>
                </div>

                <!-- Blocked by - more prominent -->
                <div x-show="selectedTask?.isBlocked && getBlockers(selectedTask).length > 0" class="p-3 bg-terra/10 border border-terra/30 rounded-lg">
                  <div class="flex items-center gap-2 mb-2">
                    <i data-lucide="alert-triangle" class="w-4 h-4 text-terra"></i>
                    <p class="text-sm font-medium text-terra">Blocked by</p>
                  </div>
                  <div class="space-y-1.5 ml-6">
                    <template x-for="blocker in getBlockers(selectedTask)" :key="blocker.id">
                      <button
                        @click="navigateToTask(blocker.id); closeTaskModal()"
                        class="flex items-center gap-2 text-sm text-terra/90 hover:text-terra w-full text-left group"
                      >
                        <span :class="{
                          'text-wool-500': blocker.status === 'todo',
                          'text-amber-500': blocker.status === 'doing'
                        }">
                          <i x-show="blocker.status === 'todo'" data-lucide="circle" class="w-3.5 h-3.5"></i>
                          <i x-show="blocker.status === 'doing'" data-lucide="loader" class="w-3.5 h-3.5 animate-spin"></i>
                        </span>
                        <span class="truncate group-hover:underline" x-text="blocker.description"></span>
                      </button>
                    </template>
                  </div>
                </div>

                <!-- Parent task -->
                <div x-show="selectedTask?.parentId && getParentTask(selectedTask)" class="flex items-center gap-3 p-3 bg-pasture-700/30 rounded-lg">
                  <div class="w-8 h-8 rounded-full bg-pasture-600 flex items-center justify-center flex-shrink-0">
                    <i data-lucide="corner-up-left" class="w-4 h-4 text-wool-400"></i>
                  </div>
                  <div class="flex-1 min-w-0">
                    <p class="text-xs text-wool-500">Subtask of</p>
                    <button
                      @click="navigateToTask(selectedTask?.parentId); closeTaskModal()"
                      class="text-sm text-amber-400 hover:underline truncate block text-left w-full"
                      x-text="getParentTask(selectedTask)?.description"
                    ></button>
                  </div>
                </div>

                <!-- Children count -->
                <div x-show="hasChildren(selectedTask)" class="flex items-center gap-3 p-3 bg-pasture-700/30 rounded-lg">
                  <div class="w-8 h-8 rounded-full bg-pasture-600 flex items-center justify-center">
                    <i data-lucide="list-tree" class="w-4 h-4 text-wool-400"></i>
                  </div>
                  <div>
                    <p class="text-xs text-wool-500">Subtasks</p>
                    <p class="text-sm text-wool-200" x-text="selectedTask?.children?.length + ' subtask(s)'"></p>
                  </div>
                </div>

                <!-- Stats row -->
                <div class="flex items-center gap-4 pt-3 border-t border-pasture-700">
                  <div x-show="selectedTask?.tokensUsed" class="flex items-center gap-1.5 text-xs text-wool-500">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                    <span x-text="formatTokens(selectedTask?.tokensUsed) + ' tokens'"></span>
                  </div>
                  <div class="flex items-center gap-1.5 text-xs text-wool-500">
                    <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                    <span x-text="formatFullTime(selectedTask?.createdAt)"></span>
                  </div>
                  <div x-show="selectedTask?.claimedAt" class="flex items-center gap-1.5 text-xs text-wool-500">
                    <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                    <span>claimed <span x-text="formatTime(selectedTask?.claimedAt)"></span></span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Modal actions -->
            <div class="p-4 border-t border-pasture-700 flex items-center justify-between gap-2 bg-pasture-850">
              <div class="flex items-center gap-2">
                <button
                  x-show="selectedTask?.status !== 'done'"
                  @click="markTaskDone(selectedTask); closeTaskModal()"
                  class="btn flex items-center gap-1.5"
                >
                  <i data-lucide="check" class="w-4 h-4"></i>
                  <span>Mark Done</span>
                </button>
                <button
                  x-show="selectedTask?.status === 'done'"
                  @click="reopenTask(selectedTask); closeTaskModal()"
                  class="btn flex items-center gap-1.5"
                >
                  <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                  <span>Reopen</span>
                </button>
                <button
                  x-show="selectedTask?.claimedBy"
                  @click="unclaimTask(selectedTask); closeTaskModal()"
                  class="btn btn-ghost flex items-center gap-1.5"
                >
                  <i data-lucide="user-minus" class="w-4 h-4"></i>
                  <span>Unclaim</span>
                </button>
              </div>
              <button
                @click="deleteTask(selectedTask)"
                class="btn btn-ghost text-terra hover:bg-terra/10"
              >
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
      </div>
      <!-- END TASKS TAB -->
