      <!-- EVALS TAB: Split view with list and detail pane -->
      <div x-show="runName && activeTab === 'evals'" class="flex-1 flex overflow-hidden" @keydown.a.prevent="selectedEval && attachEval()">
        <!-- Eval List (left side) -->
        <div class="w-72 border-r border-pasture-700 flex flex-col overflow-hidden bg-pasture-800/30">
          <div class="flex-1 overflow-y-auto p-3">
            <div class="space-y-2">
              <template x-for="evalItem in evals" :key="evalItem.id">
                <button
                  @click="selectEval(evalItem)"
                  class="w-full p-3 text-left rounded-lg transition-all border-l-4"
                  :class="{
                    'bg-pasture-600 ring-1 ring-amber-500/50 shadow-lg': selectedEval?.id === evalItem.id,
                    'bg-pasture-800/50 hover:bg-pasture-700/50': selectedEval?.id !== evalItem.id,
                    'border-l-sage': evalItem.status === 'passed',
                    'border-l-terra': evalItem.status === 'failed',
                    'border-l-amber-500': evalItem.status === 'running'
                  }"
                >
                  <div class="flex items-center gap-3">
                    <!-- Eval sheep avatar (detective hat) with status indicator -->
                    <div class="relative flex-shrink-0">
                      <div class="w-10 h-10" x-html="generateSheepSvg(evalItem.sheepConfig, 40)"></div>
                      <!-- Status indicator dot -->
                      <div class="absolute -bottom-0.5 -right-0.5 w-4 h-4 rounded-full border-2 border-pasture-800 flex items-center justify-center"
                        :class="{
                          'bg-sage': evalItem.status === 'passed',
                          'bg-terra': evalItem.status === 'failed',
                          'bg-amber-500': evalItem.status === 'running'
                        }">
                        <i x-show="evalItem.status === 'passed'" data-lucide="check" class="w-2.5 h-2.5 text-white"></i>
                        <i x-show="evalItem.status === 'failed'" data-lucide="x" class="w-2.5 h-2.5 text-white"></i>
                        <i x-show="evalItem.status === 'running'" data-lucide="loader" class="w-2.5 h-2.5 text-white animate-spin"></i>
                      </div>
                    </div>
                    <div class="flex-1 min-w-0">
                      <div class="flex items-center gap-2">
                        <span class="text-sm font-medium text-wool-200 truncate" x-text="evalItem.evalName"></span>
                        <!-- Status badge -->
                        <span
                          x-show="evalItem.status === 'passed'"
                          class="flex-shrink-0 px-1.5 py-0.5 text-[10px] font-medium uppercase tracking-wide rounded bg-sage/20 text-sage border border-sage/30"
                        >Passed</span>
                        <span
                          x-show="evalItem.status === 'failed'"
                          class="flex-shrink-0 px-1.5 py-0.5 text-[10px] font-medium uppercase tracking-wide rounded bg-terra/20 text-terra border border-terra/30"
                        >Failed</span>
                        <span
                          x-show="evalItem.status === 'running'"
                          class="flex-shrink-0 px-1.5 py-0.5 text-[10px] font-medium uppercase tracking-wide rounded bg-amber-500/20 text-amber-400 border border-amber-500/30"
                        >Running</span>
                      </div>
                      <div class="text-xs text-wool-500" x-text="getEvalDuration(evalItem)"></div>
                    </div>
                  </div>
                </button>
              </template>
            </div>

            <div x-show="evals.length === 0" class="text-center py-12">
              <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-pasture-700/30 flex items-center justify-center">
                <i data-lucide="clipboard-check" class="w-6 h-6 text-wool-600"></i>
              </div>
              <p class="text-sm text-wool-500">No evaluations yet</p>
            </div>
          </div>
        </div>

        <!-- Eval Detail (right side) -->
        <div class="flex-1 flex flex-col overflow-hidden">
          <!-- No eval selected -->
          <div x-show="!selectedEval" class="flex-1 flex items-center justify-center">
            <div class="text-center">
              <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-pasture-700/30 flex items-center justify-center">
                <i data-lucide="clipboard-check" class="w-8 h-8 text-wool-600"></i>
              </div>
              <p class="text-sm text-wool-500">Select an evaluation to view results</p>
            </div>
          </div>

          <!-- Eval selected -->
          <div x-show="selectedEval" class="flex-1 flex flex-col overflow-hidden p-6">
            <!-- Status hero -->
            <div class="text-center mb-6">
              <!-- Passed state -->
              <div x-show="selectedEval?.status === 'passed'" class="inline-block">
                <div class="w-20 h-20 mx-auto mb-3 rounded-full bg-sage/10 flex items-center justify-center ring-2 ring-sage/30">
                  <i data-lucide="check" class="w-10 h-10 text-sage"></i>
                </div>
                <h3 class="text-lg font-semibold text-sage">All Checks Passed</h3>
                <p class="text-sm text-wool-500 mt-1">Completed in <span x-text="getEvalDuration(selectedEval)"></span></p>
              </div>
              <!-- Failed state -->
              <div x-show="selectedEval?.status === 'failed'" class="inline-block">
                <div class="w-20 h-20 mx-auto mb-3 rounded-full bg-terra/10 flex items-center justify-center ring-2 ring-terra/30">
                  <i data-lucide="x" class="w-10 h-10 text-terra"></i>
                </div>
                <h3 class="text-lg font-semibold text-terra">Checks Failed</h3>
                <p class="text-sm text-wool-500 mt-1">Completed in <span x-text="getEvalDuration(selectedEval)"></span></p>
              </div>
              <!-- Running state -->
              <div x-show="selectedEval?.status === 'running'" class="inline-block">
                <div class="w-20 h-20 mx-auto mb-3 rounded-full bg-amber-500/10 flex items-center justify-center ring-2 ring-amber-500/30">
                  <i data-lucide="loader" class="w-10 h-10 text-amber-500 animate-spin"></i>
                </div>
                <h3 class="text-lg font-semibold text-amber-500">Running</h3>
                <p class="text-sm text-wool-500 mt-1">Evaluation in progress...</p>
              </div>
            </div>

            <!-- Feedback card -->
            <div x-show="selectedEval?.feedback" class="flex-1 overflow-y-auto mb-4">
              <div class="bg-pasture-800/50 rounded-lg border border-pasture-700 p-4">
                <div class="flex items-center gap-2 mb-2">
                  <i data-lucide="message-square" class="w-4 h-4 text-wool-500"></i>
                  <span class="text-xs font-medium text-wool-500 uppercase tracking-wider">Feedback</span>
                </div>
                <div class="text-sm text-wool-300 whitespace-pre-wrap" x-text="selectedEval?.feedback"></div>
              </div>
            </div>

            <!-- Attach button -->
            <div class="flex justify-center">
              <button
                @click="attachEval()"
                class="btn btn-outline flex items-center gap-2"
              >
                <i data-lucide="terminal" class="w-4 h-4"></i>
                View Full Output
                <kbd class="text-[10px] px-1.5 py-0.5 bg-pasture-800 rounded text-wool-500 ml-1">a</kbd>
              </button>
            </div>
          </div>
        </div>
      </div>
      <!-- END EVALS TAB -->
