      <!-- SPECS TAB: Combined Specification + Eval Spec -->
      <!-- Note: x-show must be on outer wrapper, x-data on inner element to access parent scope -->
      <div x-show="runName && activeTab === 'specs'" class="flex-1 flex flex-col overflow-hidden">
      <div x-data="{ specsSubTab: 'spec' }" class="flex-1 flex flex-col overflow-hidden">
        <!-- Sub-tab navigation -->
        <div class="flex items-center gap-1 px-4 py-2 border-b border-pasture-700 bg-pasture-800/30">
          <button
            @click="specsSubTab = 'spec'"
            class="px-3 py-1.5 text-xs font-medium rounded-md transition-colors"
            :class="specsSubTab === 'spec' ? 'bg-pasture-600 text-wool-100' : 'text-wool-500 hover:text-wool-300 hover:bg-pasture-700'"
          >
            <i data-lucide="file-text" class="w-3.5 h-3.5 inline mr-1.5"></i>Specification
          </button>
          <button
            @click="specsSubTab = 'eval'"
            class="px-3 py-1.5 text-xs font-medium rounded-md transition-colors"
            :class="specsSubTab === 'eval' ? 'bg-pasture-600 text-wool-100' : 'text-wool-500 hover:text-wool-300 hover:bg-pasture-700'"
          >
            <i data-lucide="check-circle" class="w-3.5 h-3.5 inline mr-1.5"></i>Eval Criteria
          </button>
        </div>

        <!-- Specification Content -->
        <div x-show="specsSubTab === 'spec'" class="flex-1 overflow-y-auto p-4">
          <div x-show="detail?.request" class="markdown-preview" x-html="renderMarkdown(detail?.request)"></div>
          <div x-show="!detail?.request" class="text-center text-wool-500 py-8">
            <svg class="w-12 h-12 mx-auto mb-3 text-wool-600">
              <use href="#sheep-sleeping"/>
            </svg>
            <p class="text-sm">No specification provided</p>
            <p class="text-xs mt-1 text-wool-600">This run was started without a spec file</p>
          </div>
        </div>

        <!-- Eval Spec Content -->
        <div x-show="specsSubTab === 'eval'" class="flex-1 overflow-y-auto p-4">
          <div x-show="evalSpec" class="markdown-preview" x-html="renderMarkdown(evalSpec)"></div>
          <div x-show="!evalSpec && !evalSpecLoading" class="text-center text-wool-500 py-8">
            <svg class="w-12 h-12 mx-auto mb-3 text-wool-600">
              <use href="#sheep-sleeping"/>
            </svg>
            <p class="text-sm">No eval criteria found</p>
            <p class="text-xs mt-1 text-wool-600">Create an eval.md file in the run directory</p>
          </div>
          <div x-show="evalSpecLoading" class="text-center text-wool-500 py-8">
            <div class="animate-pulse">Loading eval criteria...</div>
          </div>
        </div>
      </div>
      </div>
      <!-- END SPECS TAB -->
