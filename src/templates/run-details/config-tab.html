      <!-- CONFIG TAB -->
      <div x-show="runName && activeTab === 'config'" class="flex-1 overflow-y-auto p-6">
        <div class="max-w-3xl mx-auto">
          <div class="bg-pasture-800/50 rounded-lg border border-pasture-600 p-5">
            <!-- Two column layout -->
            <div class="flex gap-8">
              <!-- Left column: Execution -->
              <div class="flex-1 space-y-4">
                <h3 class="text-xs font-semibold text-wool-500 uppercase tracking-wider flex items-center gap-2">
                  <i data-lucide="cpu" class="w-3.5 h-3.5"></i>
                  Execution
                </h3>
                <div class="grid grid-cols-2 gap-x-6 gap-y-3 text-sm">
                  <div class="flex items-center justify-between">
                    <span class="text-wool-500">Runner</span>
                    <span class="text-wool-200 font-medium capitalize" x-text="detail?.runner || 'local'"></span>
                  </div>
                  <div class="flex items-center justify-between">
                    <span class="text-wool-500">Workers</span>
                    <span class="text-wool-200 font-medium" x-text="detail?.workerScale || '1'"></span>
                  </div>
                  <div class="flex items-center justify-between">
                    <span class="text-wool-500">Agent</span>
                    <span class="text-wool-200 font-medium" x-text="detail?.agentType || 'claude-code'"></span>
                  </div>
                  <div class="flex items-center justify-between">
                    <span class="text-wool-500">HITL</span>
                    <span
                      class="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-medium"
                      :class="detail?.humanInTheLoop ? 'bg-sage/20 text-sage' : 'bg-amber-500/20 text-amber-400'"
                      x-text="detail?.humanInTheLoop ? 'On' : 'Off'"
                    ></span>
                  </div>
                </div>

                <div class="border-t border-pasture-600 pt-4 mt-4">
                  <h3 class="text-xs font-semibold text-wool-500 uppercase tracking-wider flex items-center gap-2 mb-3">
                    <i data-lucide="gauge" class="w-3.5 h-3.5"></i>
                    Limits
                  </h3>
                  <div class="grid grid-cols-2 gap-x-6 gap-y-3 text-sm">
                    <div class="flex items-center justify-between">
                      <span class="text-wool-500">Time</span>
                      <span class="text-wool-200 font-medium" x-text="detail?.timeLimitMinutes ? detail.timeLimitMinutes + 'm' : 'None'"></span>
                    </div>
                    <div class="flex items-center justify-between">
                      <span class="text-wool-500">Iterations</span>
                      <span class="text-wool-200 font-medium" x-text="detail?.maxIterations || 'None'"></span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Divider -->
              <div class="w-px bg-pasture-600"></div>

              <!-- Right column: Repository -->
              <div class="flex-1 space-y-4">
                <h3 class="text-xs font-semibold text-wool-500 uppercase tracking-wider flex items-center gap-2">
                  <i data-lucide="git-branch" class="w-3.5 h-3.5"></i>
                  Repository
                </h3>
                <div class="space-y-3 text-sm">
                  <div class="flex items-center justify-between">
                    <span class="text-wool-500">Source</span>
                    <span class="text-wool-200 font-medium flex items-center gap-1.5">
                      <template x-if="detail?.remoteUrl">
                        <span class="flex items-center gap-1.5">
                          <i data-lucide="cloud" class="w-3.5 h-3.5 text-sky-400"></i>
                          Git Clone
                        </span>
                      </template>
                      <template x-if="!detail?.remoteUrl">
                        <span class="flex items-center gap-1.5">
                          <i data-lucide="file-plus" class="w-3.5 h-3.5 text-green-400"></i>
                          Greenfield
                        </span>
                      </template>
                    </span>
                  </div>
                  <div x-show="detail?.remoteUrl">
                    <div class="text-wool-500 text-xs mb-1">Remote</div>
                    <div class="text-wool-200 font-mono text-xs break-all leading-relaxed" x-text="detail?.remoteUrl"></div>
                  </div>
                  <div>
                    <div class="text-wool-500 text-xs mb-1">Workspace</div>
                    <div class="text-wool-200 font-mono text-xs break-all leading-relaxed" x-text="detail?.projectPath || '-'"></div>
                  </div>
                  <div x-show="detail?.branch" class="flex items-center justify-between">
                    <span class="text-wool-500">Branch</span>
                    <code class="text-wool-200 text-xs bg-pasture-700 px-1.5 py-0.5 rounded" x-text="detail?.branch"></code>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- END CONFIG TAB -->
