services:
  hirsel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HIRSEL_API_KEY: ${HIRSEL_API_KEY:?set in deploy/.env}
      HIRSEL_ROOT: /data
    volumes:
      - hirsel-data:/data
    stop_grace_period: 30s

volumes:
  hirsel-data:
