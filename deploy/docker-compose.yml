services:
  hirsel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HIRSEL_API_KEY=${HIRSEL_API_KEY}
    volumes:
      - hirsel-data:/home/hirsel/.hirsel
    stop_grace_period: 30s

volumes:
  hirsel-data:
