name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag and branch
        id: check
        run: |
          TAG="${{ github.ref_name }}"

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Pre-release tag detected: $TAG"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Production tag detected: $TAG"

            if ! git branch -r --contains "${{ github.sha }}" | grep -q 'origin/main'; then
              echo "::error::Production release tags must point at main"
              exit 1
            fi
          fi

  build-desktop:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
            asset_script: |
              mkdir -p dist
              cp "$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -n1)" \
                dist/hirsel-desktop-linux-amd64.deb
              cp "$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n1)" \
                dist/hirsel-desktop-linux-amd64.AppImage
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin'
            asset_script: |
              mkdir -p dist
              cp "$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n1)" \
                dist/hirsel-desktop-macos-arm64.dmg
          - platform: macos-15-intel
            args: '--target x86_64-apple-darwin'
            rust_targets: 'x86_64-apple-darwin'
            asset_script: |
              mkdir -p dist
              cp "$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n1)" \
                dist/hirsel-desktop-macos-x86_64.dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libxcb1-dev \
            libxrandr-dev \
            libx11-dev \
            libxtst-dev \
            libpng-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Prepare release assets
        shell: bash
        run: ${{ matrix.asset_script }}

      - name: Upload desktop assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/*

  build-headless:
    needs: verify-tag
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: server
            asset: hirsel-server-linux-amd64.tar.gz
          - feature: worker
            asset: hirsel-worker-linux-amd64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: release-${{ matrix.feature }}

      - name: Build ${{ matrix.feature }} binary
        working-directory: src-tauri
        run: cargo build --release --no-default-features --features ${{ matrix.feature }}

      - name: Package release asset
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset }}" -C src-tauri/target/release hirsel

      - name: Upload headless assets
        uses: actions/upload-artifact@v4
        with:
          name: headless-${{ matrix.feature }}
          path: dist/*

  publish-release:
    needs: [verify-tag, build-desktop, build-headless]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Render installer
        run: |
          sed \
            -e "s|__REPO__|${{ github.repository }}|g" \
            -e "s|__TAG__|${{ github.ref_name }}|g" \
            deploy/install_hirsel.sh > release-assets/install_hirsel.sh
          chmod +x release-assets/install_hirsel.sh

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: Write release notes
        run: |
          cat > RELEASE_BODY.md <<'EOF'
          ## Downloads

          Desktop:
          - `hirsel-desktop-macos-arm64.dmg`
          - `hirsel-desktop-macos-x86_64.dmg`
          - `hirsel-desktop-linux-amd64.deb`
          - `hirsel-desktop-linux-amd64.AppImage`

          Self-hosted backend:
          - `install_hirsel.sh`
          - `hirsel-server-linux-amd64.tar.gz`

          Worker runtime:
          - `hirsel-worker-linux-amd64.tar.gz`

          Checksums:
          - `SHA256SUMS`

          Quick install for a Linux backend:

          ```bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install_hirsel.sh | sh
          ```
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ needs.verify-tag.outputs.is_prerelease == 'true' }}
          body_path: RELEASE_BODY.md
          files: release-assets/*
