name: Release

# Triggers on version tags (v*)
# Production tags (v1.2.3) must be on main branch
# Pre-release tags (v1.2.3-rc.1, v1.2.3-staging.1) can be on any branch
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Required for creating releases
permissions:
  contents: write

jobs:
  # Verify tag is on main branch (for production releases)
  verify-branch:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag and branch
        id: check
        run: |
          TAG="${{ github.ref_name }}"

          # Check if this is a pre-release tag (contains hyphen after version)
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Pre-release tag detected: $TAG"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Production tag detected: $TAG"

            # Production tags must be on main
            if ! git branch -r --contains "${{ github.sha }}" | grep -q 'origin/main'; then
              echo "::error::Production release tags (v*.*.* without suffix) must be on main branch"
              echo "::error::Use pre-release tags (e.g., v0.3.0-rc.1, v0.3.0-staging.1) for non-main branches"
              exit 1
            fi
            echo "Tag is on main branch ✓"
          fi

  publish-tauri:
    needs: verify-branch
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1+)
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          # macOS Intel (use macos-15-intel for native Intel build)
          - platform: macos-15-intel
            args: '--target x86_64-apple-darwin'
          # Linux x64
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libxcb1-dev \
            libxrandr-dev \
            libx11-dev \
            libxtst-dev \
            libpng-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Install both macOS targets on macOS runners
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: macOS code signing
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Hirsel ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: true
          prerelease: ${{ needs.verify-branch.outputs.is_prerelease == 'true' }}
          args: ${{ matrix.args }}

      - name: Create Linux tarball
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cd src-tauri/target/release
          tar -czvf hirsel-linux-x86_64.tar.gz hirsel
          mv hirsel-linux-x86_64.tar.gz ../../../

      - name: Upload Linux tarball
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          files: hirsel-linux-x86_64.tar.gz
          tag_name: ${{ github.ref_name }}

  # Build headless binaries for remote workers and CLI
  build-headless:
    needs: verify-branch
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - feature: worker
            name: worker
          - feature: cli
            name: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: headless-${{ matrix.feature }}

      - name: Build ${{ matrix.name }} binary
        run: |
          cd src-tauri
          cargo build --release --no-default-features --features ${{ matrix.feature }}

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Package binary
        run: |
          cd src-tauri/target/release
          cp hirsel hirsel-${{ matrix.name }}-${{ steps.version.outputs.version }}-linux-amd64
          chmod +x hirsel-${{ matrix.name }}-${{ steps.version.outputs.version }}-linux-amd64

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/hirsel-${{ matrix.name }}-${{ steps.version.outputs.version }}-linux-amd64
          tag_name: ${{ github.ref_name }}
