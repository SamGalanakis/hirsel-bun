name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude hirsel-desktop-app -- -D warnings

      - name: Install frontend dependencies
        working-directory: webui
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: webui
        run: bun run build

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@hirsel.dev"
          git config --global user.name "CI"

      - name: Run tests
        run: cargo test --workspace --exclude hirsel-desktop-app --lib
