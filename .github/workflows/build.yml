name: Build

on:
  push:
    branches: [main, staging]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_ui:
        description: 'Build UI (Tauri GUI)'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build CLI binaries for Linux x86_64
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: worker
            features: worker
          - name: server
            features: server
          - name: cli
            features: cli

    steps:
      - uses: actions/checkout@v4

      - name: Get version and branch
        id: info
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Get branch name, use 'release' for tags
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            BRANCH="release"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          # Create suffix: version only for main/release, branch-version otherwise
          if [[ "$BRANCH" == "main" || "$BRANCH" == "release" ]]; then
            SUFFIX="$VERSION"
          else
            SUFFIX="${BRANCH}-${VERSION}"
          fi
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.name }}

      - name: Build ${{ matrix.name }} binary
        working-directory: src-tauri
        run: cargo build --release --no-default-features --features ${{ matrix.features }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hirsel-${{ matrix.name }}-${{ steps.info.outputs.suffix }}-linux-amd64
          path: src-tauri/target/release/hirsel

  # Build Tauri GUI (optional, heavier build)
  build-ui:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ui || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libxcb1-dev \
            libxrandr-dev \
            libx11-dev \
            libxtst-dev \
            libpng-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ui

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: hirsel-ui-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: hirsel-ui-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: hirsel-ui-linux-amd64
          path: src-tauri/target/release/hirsel

  # Combine all CLI binaries into single artifact
  combine-binaries:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4

      - name: Get version and branch
        id: info
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            BRANCH="release"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          if [[ "$BRANCH" == "main" || "$BRANCH" == "release" ]]; then
            SUFFIX="$VERSION"
          else
            SUFFIX="${BRANCH}-${VERSION}"
          fi
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare combined artifacts
        run: |
          SUFFIX=${{ steps.info.outputs.suffix }}
          mkdir -p combined
          cp artifacts/hirsel-worker-${SUFFIX}-linux-amd64/hirsel combined/hirsel-worker-${SUFFIX}-linux-amd64
          cp artifacts/hirsel-server-${SUFFIX}-linux-amd64/hirsel combined/hirsel-server-${SUFFIX}-linux-amd64
          cp artifacts/hirsel-cli-${SUFFIX}-linux-amd64/hirsel combined/hirsel-cli-${SUFFIX}-linux-amd64
          chmod +x combined/*

      - name: Upload combined binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ steps.info.outputs.suffix }}
          path: combined/

  # Build and push Docker image
  docker:
    runs-on: ubuntu-latest
    needs: combine-binaries
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version and branch
        id: info
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            BRANCH="release"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          if [[ "$BRANCH" == "main" || "$BRANCH" == "release" ]]; then
            SUFFIX="$VERSION"
          else
            SUFFIX="${BRANCH}-${VERSION}"
          fi
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ steps.info.outputs.suffix }}
          path: docker/

      - name: Rename binary for Dockerfile
        run: |
          SUFFIX=${{ steps.info.outputs.suffix }}
          mv docker/hirsel-cli-${SUFFIX}-linux-amd64 docker/hirsel-linux-amd64
          chmod +x docker/hirsel-linux-amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.info.outputs.suffix }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create release with binaries
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [combine-binaries, docker]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: info
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Release job only runs on tags, so suffix is just version
          echo "suffix=$VERSION" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ steps.info.outputs.suffix }}
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          generate_release_notes: true
