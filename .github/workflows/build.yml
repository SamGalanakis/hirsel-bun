name: Build

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_ui:
        description: 'Build UI (Tauri GUI)'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build headless Linux binaries
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: worker
            features: worker
          - name: server
            features: server

    steps:
      - uses: actions/checkout@v4

      - name: Get version and branch
        id: info
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Get branch name, use 'release' for tags
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            BRANCH="release"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          # Create suffix: version only for main/release, branch-version otherwise
          if [[ "$BRANCH" == "main" || "$BRANCH" == "release" ]]; then
            SUFFIX="$VERSION"
          else
            SUFFIX="${BRANCH}-${VERSION}"
          fi
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.name }}

      - name: Build ${{ matrix.name }} binary
        working-directory: src-tauri
        run: cargo build --release --no-default-features --features ${{ matrix.features }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hirsel-${{ matrix.name }}-${{ steps.info.outputs.suffix }}-linux-amd64
          path: src-tauri/target/release/hirsel

  # Build Tauri GUI (optional, heavier build)
  build-ui:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ui }}
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libxcb1-dev \
            libxrandr-dev \
            libx11-dev \
            libxtst-dev \
            libpng-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ui

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: hirsel-ui-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: hirsel-ui-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: hirsel-ui-linux-amd64
          path: src-tauri/target/release/hirsel

  # Combine headless binaries into a single artifact
  combine-binaries:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4

      - name: Get version and branch
        id: info
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            BRANCH="release"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          if [[ "$BRANCH" == "main" || "$BRANCH" == "release" ]]; then
            SUFFIX="$VERSION"
          else
            SUFFIX="${BRANCH}-${VERSION}"
          fi
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare combined artifacts
        run: |
          SUFFIX=${{ steps.info.outputs.suffix }}
          mkdir -p combined
          cp artifacts/hirsel-worker-${SUFFIX}-linux-amd64/hirsel combined/hirsel-worker-${SUFFIX}-linux-amd64
          cp artifacts/hirsel-server-${SUFFIX}-linux-amd64/hirsel combined/hirsel-server-${SUFFIX}-linux-amd64
          chmod +x combined/*

      - name: Upload combined binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ steps.info.outputs.suffix }}
          path: combined/
