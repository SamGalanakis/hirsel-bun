# fly.toml - Hirsel coordinator deployment for Fly.io
#
# Deploy the coordinator to Fly.io for remote orchestration.
# Uses Tigris for S3-compatible object storage (snapshots, file sync).
#
# Quick start:
#   1. Create the app:
#      fly apps create hirsel-coordinator
#
#   2. Create a volume for data persistence:
#      fly volumes create hirsel_data --size 1 --region ams
#
#   3. Create Tigris storage (for snapshots):
#      fly storage create --name hirsel-storage
#      (This auto-sets AWS_* env vars)
#
#   4. Set secrets:
#      fly secrets set HIRSEL_API_KEY=<your-secret-key>
#
#   5. Build and deploy:
#      cd src-tauri && cargo build --release --no-default-features --features cli,s3-storage
#      fly deploy
#
# See docs/fly-deployment.md for full guide.

app = "hirsel-coordinator"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile.coordinator"

[env]
  HIRSEL_ROOT = "/data"
  RUST_LOG = "info,hirsel=debug"
  # Tigris/S3 env vars (AWS_*) are set automatically by `fly storage create`

[mounts]
  source = "hirsel_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    type = "http"
    port = 3000
    path = "/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
