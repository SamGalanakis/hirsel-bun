repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^(src-tauri/target/|tauri-plugin-mcp/target/|tauri-plugin-mcp/permissions/|node_modules/|dist/)
      - id: trailing-whitespace
        exclude: ^(src-tauri/target/|tauri-plugin-mcp/target/|node_modules/|dist/)
      - id: check-yaml
      - id: check-json
        exclude: ^(src-tauri/target/|tauri-plugin-mcp/target/|node_modules/|dist/)

  - repo: local
    hooks:
      - id: typescript
        name: TypeScript
        entry: npx tsc --noEmit
        language: system
        pass_filenames: false
        types: [ts, tsx]

      - id: cargo-fmt
        name: Cargo fmt
        entry: cargo fmt --manifest-path src-tauri/Cargo.toml
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit]

      - id: cargo-check
        name: Cargo check
        entry: cargo check --manifest-path src-tauri/Cargo.toml
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit]
        require_serial: true

      - id: cargo-clippy
        name: Cargo clippy
        entry: cargo clippy --manifest-path src-tauri/Cargo.toml -- -W clippy::all
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit]
        require_serial: true
