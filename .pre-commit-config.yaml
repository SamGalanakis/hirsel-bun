repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^(target/|node_modules/|dist/)
      - id: trailing-whitespace
        exclude: ^(target/|node_modules/|dist/)
      - id: check-yaml
      - id: check-json
        exclude: ^(target/|node_modules/|dist/)

  - repo: https://github.com/crate-ci/typos
    rev: v1.28.4
    hooks:
      - id: typos
        exclude: ^(target/|node_modules/|dist/)

  - repo: local
    hooks:
      - id: typescript
        name: TypeScript
        entry: bash -lc 'cd webui && bunx tsc -p tsconfig.json --noEmit'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-fmt
        name: Cargo fmt
        entry: cargo fmt --all
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit]

      - id: cargo-check
        name: Cargo check
        entry: cargo check --workspace
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit]
        require_serial: true

      - id: cargo-clippy
        name: Cargo clippy
        entry: cargo clippy --workspace -- -W clippy::all
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit]
        require_serial: true

      - id: cargo-deny
        name: Cargo deny
        entry: cargo deny check
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit]
