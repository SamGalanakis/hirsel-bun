[workspace]
members = [
    "crates/hirsel-core",
    "crates/hirsel-cli",
    "src-tauri",
]
default-members = ["crates/hirsel-cli"]
resolver = "2"

[workspace.dependencies]
lash = { git = "https://github.com/SamGalanakis/lash", rev = "b51956a9f4867f3502b151e324d1f64cc337bd54", package = "lash" }
axum = { version = "0.8", features = ["multipart", "ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
surrealdb = { version = "3.0.5", default-features = false, features = ["kv-surrealkv"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dirs = "6"
tracing = "0.1"
tracing-appender = "0.2"
regex = "1"
scraper = "0.23"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "io-std", "fs", "process", "signal", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-stream = "0.1"
async-stream = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
rand = "0.9.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
walkdir = "2"
globset = "0.4"
aes-gcm = "0.10"
hex = "0.4"
base64 = "0.22"
mime_guess = "2"
imara-diff = "0.2"
tempfile = "3"
open = "5.3.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-chrome = "0.7"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-build = { version = "2", features = [] }
portable-pty = "0.9"

[profile.profiling]
inherits = "release"
debug = true
