# LiteFS configuration for Fly.io
#
# LiteFS provides distributed SQLite replication across Fly machines.
# See: https://fly.io/docs/litefs/

fuse:
  dir: "/litefs"

data:
  dir: "/var/lib/litefs"

lease:
  type: "consul"
  consul:
    url: "${FLY_CONSUL_URL}"
    key: "litefs/${FLY_APP_NAME}"
  advertise-url: "http://${HOSTNAME}.vm.${FLY_APP_NAME}.internal:20202"
  candidate: ${FLY_REGION == PRIMARY_REGION}
  promote: true

exec:
  - cmd: "hirsel serve --port 3000"
