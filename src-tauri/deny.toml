[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
version = 2
# Ignore unmaintained crates (Tauri has many unmaintained transitive deps)
unmaintained = "none"
# RUSTSEC-2023-0071: rsa timing sidechannel - no fix available, transitive dep from octocrab
# Only used for JWT signing (GitHub API auth), not in network-observable crypto operations
# RUSTSEC-2026-0007: bytes integer overflow - transitive dep, waiting for upstream fix
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0007"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    # Internal proprietary dependency (lash-core)
    "LicenseRef-LASH-PROPRIETARY",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true
registries = []

# Allow local workspace crates without licenses
[[licenses.clarify]]
crate = "hirsel"
expression = "MIT"
license-files = []

# lash-core currently has no SPDX metadata in Cargo.toml.
# Treat it as a private/proprietary internal dependency.
[[licenses.clarify]]
crate = "lash-core"
expression = "LicenseRef-LASH-PROPRIETARY"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/SamGalanakis/lash"]
