[package]
name = "hirsel"
version = "0.1.0"
description = "Herd your AI coding agents"
edition = "2021"

[lib]
name = "hirsel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
git2 = "0.19"
dirs = "6"
tracing = "0.1"
regex = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
libc = "0.2"
agent-client-protocol = "0.9"

[dev-dependencies]
tempfile = "3"
