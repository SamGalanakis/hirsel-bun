[package]
name = "hirsel"
version = "0.1.0"
description = "Herd your AI coding agents"
edition = "2021"

[lib]
name = "hirsel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
regex = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
