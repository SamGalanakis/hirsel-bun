[package]
name = "hirsel-desktop-app"
version = "0.4.0"
description = "Hirsel desktop application"
edition = "2021"
license = "MIT"
autobins = false
default-run = "hirsel-desktop"

[lib]
name = "hirsel_desktop_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }
chrono = { workspace = true }

[features]
default = []
gui = [
    "dep:tauri",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-opener",
]

[dependencies]
hirsel-core = { path = "../crates/hirsel-core" }
tauri = { workspace = true, optional = true }
tauri-plugin-single-instance = { workspace = true, optional = true }
tauri-plugin-opener = { workspace = true, optional = true }
tracing = { workspace = true }
serde = { workspace = true }

[[bin]]
name = "hirsel-desktop"
path = "src/bin/hirsel-desktop.rs"
required-features = ["gui"]
