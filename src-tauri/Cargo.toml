[package]
name = "hirsel"
version = "0.1.0"
description = "Herd your AI coding agents"
edition = "2021"

[lib]
name = "hirsel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["gui"]
gui = [
    "dep:tauri",
    "dep:tauri-plugin-log",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-mcp",
    "tauri-build",
]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
# GUI dependencies (feature-gated)
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-log = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-mcp = { path = "../tauri-plugin-mcp", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
git2 = "0.20"
dirs = "6"
tracing = "0.1"
regex = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
libc = "0.2"
agent-client-protocol = "0.9.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-stream = "0.1"
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"
lazy_static = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.9.2"
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
shellexpand = "3"
which = "8"
ratatui = "0.30"
crossterm = "0.29"
urlencoding = "2"
serde_urlencoded = "0.7"
aes-gcm = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
