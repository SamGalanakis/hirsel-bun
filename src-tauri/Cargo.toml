[package]
name = "hirsel"
version = "0.3.2"
description = "Herd your AI coding agents"
edition = "2021"

[lib]
name = "hirsel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Default: GUI
default = ["gui"]

# GUI (Tauri desktop app, includes the embedded backend runtime)
gui = [
    "dep:tauri",
    "dep:tauri-plugin-log",
    "dep:tauri-plugin-single-instance",
    "dep:rfd",
    "tauri-build",
    "server",
]

# Server mode (hirsel serve) - coordinator/orchestrator
server = ["dep:axum", "dep:tower-http", "dep:hyper-util"]

# Minimal worker binary for container/host worker entrypoints
# Build with: cargo build --release --no-default-features --features worker
worker = ["dep:axum", "dep:tower-http"]

# S3 storage backend
s3-storage = ["dep:aws-sdk-s3", "dep:aws-config", "dep:tempfile"]

# Development features (debug logging, etc.)
dev = ["dep:tracing-subscriber"]

# Profiling (tracing-chrome output for Perfetto UI)
profiling = ["dev", "dep:tracing-chrome"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
chrono = "0.4"

[dependencies]
# === GUI dependencies (feature-gated) ===
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-log = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
rfd = { version = "0.17", optional = true }

# === Server dependencies (feature-gated) ===
axum = { version = "0.8", features = ["multipart"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"], optional = true }

# === Core dependencies (always included) ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
git2 = { version = "0.20", features = ["vendored-libgit2"] }
dirs = "6"
tracing = "0.1"
regex = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
libc = "0.2"
similar = "2"
agent-client-protocol = { version = "0.9.4", features = ["unstable"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "io-std", "fs", "process", "signal", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-stream = "0.1"
async-stream = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
rand = "0.9.2"
reqwest = { version = "0.13", features = ["json", "stream"] }
urlencoding = "2"
serde_urlencoded = "0.7"
flate2 = "1"
tar = "0.4"
walkdir = "2"
aes-gcm = "0.10"
hex = "0.4"
base64 = "0.22"
octocrab = "0.49"
lash = { git = "https://github.com/SamGalanakis/lash", rev = "dc5f5017693cb8e792e6bcd2e16d21557745048a", package = "lash" }

# S3 storage (feature-gated)
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", features = ["behavior-version-latest"], optional = true }
tempfile = { version = "3", optional = true }

# Development/debugging (feature-gated)
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"], optional = true }
tracing-chrome = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.profiling]
inherits = "release"
debug = true
