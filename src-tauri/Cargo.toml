[package]
name = "hirsel"
version = "0.3.2"
description = "Herd your AI coding agents"
edition = "2021"
autobins = false
default-run = "hirsel-desktop"

[lib]
name = "hirsel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Default: headless worker/core build
default = []

# GUI (Tauri desktop shell that loads the backend-served web app)
gui = [
    "dep:tauri",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-opener",
    "tauri-build",
]

# Headless backend server
server = ["dep:axum", "dep:tower-http"]

# Development features (debug logging, etc.)
dev = []

# Profiling (tracing-chrome output for Perfetto UI)
profiling = ["dev", "dep:tracing-chrome"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
chrono = "0.4"

[dependencies]
# === GUI dependencies (feature-gated) ===
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

# === Server dependencies (feature-gated) ===
axum = { version = "0.8", features = ["multipart"], optional = true }
tower-http = { version = "0.6", features = ["cors", "fs"], optional = true }

# === Core dependencies (always included) ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
git2 = { version = "0.20", features = ["vendored-libgit2"] }
dirs = "6"
tracing = "0.1"
tracing-appender = "0.2"
regex = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "io-std", "fs", "process", "signal", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-stream = "0.1"
async-stream = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
rand = "0.9.2"
reqwest = { version = "0.13", features = ["json", "stream"] }
walkdir = "2"
aes-gcm = "0.10"
hex = "0.4"
base64 = "0.22"
lash = { git = "https://github.com/SamGalanakis/lash", rev = "2a927b95dd20a7c50ef17d97e8bdb39cd4496ff7", package = "lash" }

tempfile = "3"

# Development/debugging
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-chrome = { version = "0.7", optional = true }
open = "5.3.3"

[dev-dependencies]

[profile.profiling]
inherits = "release"
debug = true

[[bin]]
name = "hirsel-worker"
path = "src/bin/hirsel-worker.rs"

[[bin]]
name = "hirsel-server"
path = "src/bin/hirsel-server.rs"
required-features = ["server"]

[[bin]]
name = "hirsel-desktop"
path = "src/bin/hirsel-desktop.rs"
required-features = ["gui"]
