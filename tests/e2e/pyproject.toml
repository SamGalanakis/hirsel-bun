[project]
name = "hirsel-e2e"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
timeout = 600
markers = [
    "slow: marks tests as slow (fly runners)",
    "docker: requires docker",
    "fly: requires fly CLI",
]
